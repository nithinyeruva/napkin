 "Joint stiffness constant C":{sym:"C",
  d:"The share of an external load that lands on the bolt rather than unloading the clamped faces.",
  n:"A stiff joint with a springy bolt gives a low C, which is what you want — the bolt sees little of the applied load.",
  r:"0.2–0.3 for metal-on-metal. Add a soft gasket and it climbs."},
 "Separation factor":{sym:"Fi/((1−C)P)",
  d:"How many times the applied load the joint takes before the clamped faces actually lift apart.",
  n:"Often what governs a joint, well before the bolt itself is in danger. Once faces separate the bolt takes the full load directly and fatigue life collapses."},
 "Load factor to yield":{sym:"(Sy·At − Fi)/(C·P)",
  d:"How many times the applied load before the bolt itself yields."},
 "Hoop stress":{sym:"σ = Pr/t",
  d:"Circumferential stress trying to split a pressurised cylinder along its length.",
  n:"Exactly twice the longitudinal stress — which is why a pressurised tube splits lengthwise, not around.",
  r:"Thin-wall theory only holds while t ≤ r/10.",
  svg:`<svg ${TV}><circle class="dg-body" cx="130" cy="44" r="30"/>
   <circle cx="130" cy="44" r="24" fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"/>
   <path class="dg-load" d="M130,32 L130,18 M126,23 L130,18 L134,23"/>
   <path class="dg-load" d="M130,56 L130,70 M126,65 L130,70 L134,65"/>
   <text class="dg-txt" x="176" y="47">splits lengthwise</text></svg>`},
 "Longitudinal stress":{sym:"σ = Pr/2t",
  d:"Axial stress from pressure pushing on the end caps. Half the hoop stress in the same vessel."},
 "Reynolds":{sym:"Re = 3160·GPM/(d·v)",
  d:"Whether flow is orderly or chaotic. Below about 2300 it's laminar — smooth layers that slide past each other and barely mix.",
  n:"Laminar flow is a thermal disaster: the layer touching the wall stays there, insulating everything behind it. Turbulent flow constantly swaps hot fluid at the wall for cool fluid from the core.",
  r:"10,000+ for mold cooling. Below 4,000 you are wasting pump energy for very little heat transfer.",
  svg:`<svg ${TV}><path class="dg-thin" d="M20,16 L120,16 M20,64 L120,64"/>
   <path class="dg-load" d="M30,28 L108,28 M30,40 L108,40 M30,52 L108,52"/>
   <text class="dg-txt" x="70" y="80" text-anchor="middle">laminar</text>
   <path class="dg-thin" d="M140,16 L240,16 M140,64 L240,64"/>
   <path class="dg-load" d="M148,40 C160,24 172,56 184,34 C196,20 208,54 220,38 C226,32 232,42 236,40"/>
   <path class="dg-load" d="M150,26 C164,44 176,22 190,46 C202,60 214,28 232,30"/>
   <text class="dg-txt" x="190" y="80" text-anchor="middle">turbulent</text></svg>`},
 "Velocity":{sym:"V = 0.4085·GPM/d²",
  d:"Bulk flow speed through the channel.",
  r:"1–2 ft/s minimum to stay turbulent; above ~10 ft/s erosion starts eating the channel."},
 "Friction factor f":{sym:"f",
  d:"Dimensionless resistance of the pipe wall, from the Swamee-Jain fit to the Colebrook equation. Depends on roughness and Reynolds number."},
 "Total pressure drop":{sym:"Δp",
  d:"Pressure the pump must supply to push this flow through this circuit — wall friction plus every bend, fitting and baffle turnaround."},
 "Plate rigidity D":{sym:"D = Et³/12(1−v²)",
  d:"A plate's flexural stiffness. The plate equivalent of EI for a beam.",
  n:"Cubic in thickness — deflection is extremely sensitive to how thick the plate is."},
 "Aspect ratio a/b":{sym:"a/b",
  d:"Long side over short side. It sets the β and α coefficients, and past about 3 the plate behaves like a one-way strip spanning the short direction.",
  n:"The short side dominates — a long plate is no weaker than a square one of the same width."},
 "Max stress":{sym:"σ",
  d:"Peak stress in the part from this loading, compared against yield to get the safety factor."},
 "Max moment M":{sym:"M",
  d:"Largest internal bending moment along the beam. Where it peaks depends on the support conditions.",
  n:"A cantilever sees four times the moment of a simply supported beam under the same centre load."},
 "Bending stress":{sym:"σ = M/S",
  d:"Stress from bending: moment over section modulus. Maximum at the outermost fibre."},
 "Regime":{d:"Which equation governs — the physics changes, so the formula does too."},
 "Material":{d:"Sets E for stiffness, Sy for strength. These are typical handbook values; real stock varies with heat, temper and thickness.",
  r:"Check a mill cert before releasing anything that matters."},
 "Target safety factor":{d:"The margin the back-solve sizes for. Everything under 'Sized for SF' is the geometry needed to hit exactly this number."},
 "Deflection limit L/x":{d:"Allowable sag as a fraction of span. Enter the denominator: 240 means L/240.",
  r:"240 general structure · 360 where finish or fit matters · 180 is loose."},
};
Object.assign(G,{
 "Load case":{d:"How the beam is held and where the load sits. This changes the answer more than any material choice — a cantilever sees four times the moment of a simply supported beam under the same centre load."},
 "End condition":{d:"How the column's ends are restrained. It sets K, the effective length factor.",
  r:"Pinned-pinned K=1 · fixed-fixed K=0.5 · fixed-free K=2 (the worst case by far)."},
 "K value":{d:"Theoretical K assumes perfect end fixity. Real bolted or welded joints are softer, so AISC recommends design values — 0.65 for fixed-fixed, 0.80 for fixed-pinned.",
  r:"Use the AISC values for anything you're actually building."},
 "Edge condition":{d:"How the plate is held at its boundary. Clamped edges more than halve the deflection but move peak stress to the edge; simply supported edges peak at the centre."},
 "Preload, fraction of proof":{d:"How much of the bolt's elastic capacity you use up clamping. Higher preload means a stiffer, more fatigue-resistant joint — but less headroom before yield.",
  r:"0.75 for reusable joints, 0.90 for permanent ones."},
 "External tensile load P":{d:"Load per bolt trying to pull the joint apart. From a pressure end cap, a lever arm, or a hand calc.",
  n:"Only C times this actually reaches the bolt — the rest unloads the clamped faces."},
 "Shear load V":{d:"Load per bolt acting across the joint rather than along the bolt.",
  n:"Properly preloaded joints carry shear by friction between the faces, not by the bolt in shear. This check is the conservative fallback."},
 "Wall roughness e":{d:"Absolute height of surface irregularities inside the channel.",
  r:"Drilled or commercial steel ~0.0018 in · smooth drawn tube ~0.0001 in."},
 "Minor-loss K total":{d:"Sum of loss coefficients for everything that isn't straight pipe. In a real cooling circuit these usually dominate the friction losses.",
  r:"~0.9 per sharp bend · 1.5–2 per baffle turnaround · 0.5–1 per fitting."},
 "Coolant rise dT":{d:"Temperature the coolant is allowed to gain between inlet and outlet.",
  n:"A small rise means uniform cooling but demands more flow — the two trade directly.",
  r:"Molds: 4 °F or less."},
 "Circuit length":{d:"Total developed length the water actually travels, including every up-and-down baffle pass — not the straight-line distance across the part."},
 "Pump available":{d:"Pressure your pump delivers at this flow rate, read off its curve. Not the headline maximum — that's at zero flow."},
 "Pump margin":{d:"What's left after the circuit's losses. Negative means this pump can't sustain this flow.",
  r:"Keep a couple of psi spare for fouling and added fittings."},
 "Tightening torque":{d:"What to set the wrench to in order to reach the target preload.",
  n:"Scatters ±25% or worse because it depends entirely on friction. For a joint that matters, use turn-of-nut or measure bolt stretch directly."},
 "Bolt force Fb":{d:"Total tension in the bolt: preload plus its share of the external load. This is what gets compared against proof."},
 "End-cap force":{d:"Total force pressure exerts on a flat cover, trying to blow it off. Divide by the bolt count to size the fasteners."},
 "Beam weight":{d:"Self-weight of the beam itself. Worth checking against the applied load — if it's a meaningful fraction, it belongs in the load case."},
 "Critical stress":{d:"Average stress in the column at the moment it buckles. Multiply by area to get the critical load."},
 "Area A":{d:"Cross-sectional area. Sets axial capacity and, with density, the weight."},
});
// aliases — the same idea under a different label in another calculator
G["Safety factor on yield"]=G["Safety factor"];
G["Max deflection"]=G["Max deflection"];
G["Sphere / dished end stress"]=G["Longitudinal stress"];
G["Tensile load per bolt"]=G["External tensile load P"];
G["Channel diameter"]=G["Velocity"];
G["Flow this circuit"]=G["Velocity"];
G["Viscosity"]={d:"Kinematic viscosity of water at this temperature. It drops sharply as water warms, which raises Reynolds number — hot water is easier to keep turbulent.",
 r:"0.95 cSt at 70 °F · 0.68 at 100 °F · 0.47 at 140 °F."};
G["Required total flow"]={sym:"GPM = Q/(500·dT)",
 d:"Flow needed to carry the heat load at your allowed temperature rise. The 500 is 8.33 lb/gal × 60 min × the specific heat of water.",
 r:"Molds want the in-to-out rise at 4 °F or less for uniform cooling."};
G["Heat load Q"]=G["Required total flow"];   // must follow the definition above

// Fail loudly rather than rendering an empty tooltip if an alias ever points at
// a term that doesn't exist yet.
for(const [k,g] of Object.entries(G)) if(!g||!g.d) console.warn("glossary: no definition for",k);

function termHtml(label,text){
  if(!G[label]) return esc(text??label);
  return `<button type="button" class="term" data-term="${esc(label)}"
    aria-label="${esc(label)} — what is this?">${esc(text??label)}</button>`;
}
// A label element already owns its input, so a nested button would fight it for
// the click. Sit the affordance outside the label text instead.
function info(label){
  if(!G[label]) return "";
  return ` <button type="button" class="infobtn term" data-term="${esc(label)}"
    aria-label="What is ${esc(label)}?">?</button>`;
}

let tipEl=null;
function hideTip(){ tipEl?.remove(); tipEl=null; }
function showTip(btn){
  const g=G[btn.dataset.term]; if(!g) return;
  hideTip();
  tipEl=document.createElement("div");
  tipEl.className="tip"; tipEl.setAttribute("role","tooltip");
  tipEl.innerHTML=`<h4>${esc(btn.dataset.term)}${g.sym?`<span class="sym">${esc(g.sym)}</span>`:""}</h4>
    <p>${esc(g.d)}</p>${g.svg||""}${g.n?`<p>${esc(g.n)}</p>`:""}
    ${g.r?`<p class="rule">${esc(g.r)}</p>`:""}`;
  document.body.appendChild(tipEl);
  const b=btn.getBoundingClientRect(), t=tipEl.getBoundingClientRect();
  let left=Math.min(Math.max(8,b.left),innerWidth-t.width-8);
  let top=b.bottom+8;
  if(top+t.height>innerHeight-8) top=Math.max(8,b.top-t.height-8);
  tipEl.style.left=left+"px"; tipEl.style.top=top+"px";
}
document.addEventListener("pointerover",e=>{
  const b=e.target.closest?.(".term"); if(b) showTip(b);
});
document.addEventListener("pointerout",e=>{
  const b=e.target.closest?.(".term");
  if(b&&!e.relatedTarget?.closest?.(".tip")) hideTip();
});
document.addEventListener("focusin",e=>{
  const b=e.target.closest?.(".term"); if(b) showTip(b);
});
document.addEventListener("click",e=>{
  const b=e.target.closest?.(".term");
  if(b){ e.preventDefault(); tipEl?showTip(b):showTip(b); return; }  // tap on touch
  if(!e.target.closest?.(".tip")) hideTip();
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") hideTip(); });
document.addEventListener("scroll",hideTip,true);

/* ---- Start: route a plain-English description to a calculator -------------
   Rule-based on purpose. A published page cannot call a language model, and for
   a domain this narrow it doesn't need one — the vocabulary is small and the
   quantities are regular. What matters is that it NEVER silently guesses: it
   shows what it understood and lets you fix it before anything loads.        */

const ROUTE=[
 ["beams",   ["beam","bracket","cantilever","overhang","span","sag","deflect","arm","rail",
              "crossmember","shelf","support arm","mount","bends","bending"]],
 ["columns", ["column","strut","post","buckle","buckling","leg","pillar","jack stand",
              "compression member","upright"]],
 ["shafts",  ["shaft","axle","spindle","drive","torque","rpm","horsepower","twist","motor",
              "gearbox","pulley shaft"]],
 ["bolts",   ["bolt","screw","fastener","preload","clamp","joint","thread","socket head",
              "cap screw","torque spec","stud"]],
 ["plates",  ["plate","cover","panel","lid","diaphragm","flat plate","bulkhead"]],
 ["pressure",["vessel","cylinder","tank","hoop","burst","pressurized","accumulator",
              "pipe wall","reservoir"]],
 ["cooling", ["cool","coolant","water line","channel","flow","gpm","heat load","btu",
              "turbulent","reynolds","mold cooling","radiator","circuit"]],
 ["sections",["section","moment of inertia","cross-section","area moment","tube size"]],
];

const MATHINT=[
 [/\b(6061|aluminium|aluminum|alu\b)/i,"Al 6061-T6"],[/\b7075\b/i,"Al 7075-T6"],
 [/\b4140\b/i,"Steel 4140 (Q&T 28HRC)"],[/\b1018\b/i,"Steel 1018 (CR)"],
 [/\b(a36|mild steel|hot rolled)\b/i,"Steel A36 (HR)"],
 [/\bp20\b/i,"Tool steel P20 (30HRC)"],[/\bh13\b/i,"Tool steel H13 (45HRC)"],
 [/\b(17-?4)\b/i,"SS 17-4 PH (H900)"],[/\b(304|stainless)\b/i,"SS 304 (annealed)"],
 [/\bbrass\b/i,"Brass C360 (1/2 hard)"],[/\bcopper\b/i,"Copper C110"],
 [/\b(titanium|ti-?6)\b/i,"Ti-6Al-4V"],[/\bpeek\b/i,"PEEK"],
 [/\b(delrin|acetal)\b/i,"Acetal (Delrin)"],[/\bnylon\b/i,"Nylon 6/6 (dry)"],
 [/\b(polycarb|lexan)\b/i,"Polycarbonate"],[/\babs\b/i,"ABS (molded)"],[/\bsteel\b/i,"Steel A36 (HR)"],
];

// number, optionally a fraction, then a unit
const NUMU=/(\d+\s+\d+\/\d+|\d+\/\d+|\d*\.?\d+)\s*(in\b|inch(?:es)?\b|"|mm\b|ft\b|feet\b|lbf?\b|lbs\b|pounds?\b|psi\b|rpm\b|hp\b|btu\/?h?r?\b|gpm\b|deg\b|°)/gi;
function toNum(s){
  s=s.trim();
  if(/^\d+\s+\d+\/\d+$/.test(s)){const[a,b]=s.split(/\s+/);const[n,d]=b.split("/");return +a+ +n/+d;}
  if(/^\d+\/\d+$/.test(s)){const[n,d]=s.split("/");return +n/+d;}
  return parseFloat(s);
}
const CTX=[
 [/\b(long|length|span|spans?|between supports)\b/i,"L"],
 [/\b(thick|thickness|wall)\b/i,"t"],
 [/\b(diameter|dia\b|bore|od\b|i\.?d\.?\b|across|round|rod)\b/i,"d"],
 [/\b(wide|width)\b/i,"b"],
 [/\b(tall|height|high|deep|depth)\b/i,"h"],
 [/\b(load|force|weight|holds?|carr(?:y|ies)|pulls?|hangs?|push(?:es)?)\b/i,"P"],
 [/\b(pressure|psi)\b/i,"q"],
];

function parseQuery(text){
  const t=" "+text.toLowerCase()+" ";
  // route
  const score={};
  for(const [k,words] of ROUTE){ score[k]=0;
    for(const w of words) if(t.includes(w)) score[k]+=w.includes(" ")?3:2; }
  if(/\bpsi\b/.test(t)&&score.pressure!==undefined) score.pressure+=1;
  if(/\b(gpm|btu)\b/.test(t)) score.cooling+=2;
  if(/\b(rpm|hp|horsepower)\b/.test(t)) score.shafts+=2;
  if(/\b\d+\/\d+-\d+\b/.test(t)) score.bolts+=4;   // a thread designation
  const ranked=Object.entries(score).sort((a,b)=>b[1]-a[1]);
  const [calc,top]=ranked[0];
  const confident = top>0 && (ranked.length<2 || top>ranked[1][1]);
  if(!top) return {calc:null,alts:ROUTE.map(r=>r[0]),values:{},read:[]};

  const v={}, read=[];
  const push=(k,val,unit,why)=>{ if(v[k]===undefined){ v[k]=val; read.push([k,val,unit,why]); } };

  // material
  for(const [re,name] of MATHINT) if(re.test(text)){ push("material",name,"","named"); break; }

  // thread designation
  const th=text.match(/\b(#?\d+(?:\/\d+)?)-(\d+)\b/);
  if(th){ const key=`${th[1]}-${th[2]}`; if(THREADS[key]) push("thread",key,"","thread called out"); }

  // quantities with units, tagged by the words immediately around them
  let m;
  NUMU.lastIndex=0;
  while((m=NUMU.exec(text))!==null){
    let n=toNum(m[1]); const u=m[2].toLowerCase();
    // Clip each window at the neighbouring quantity. Without this, "4 in ID with
    // 0.12 in wall" reads the 4 as a thickness, and "6 in across under 150 psi"
    // reads the 6 as a pressure — each stealing the next number's noun.
    const before=text.slice(Math.max(0,m.index-30),m.index).replace(/^[\s\S]*\d/,"");
    const after=text.slice(m.index+m[0].length,m.index+m[0].length+26).split(/\d/)[0];
    const near=before+" "+after;
    if(/^mm$/.test(u)) n/=25.4;
    if(/^(ft|feet)$/.test(u)) n*= (calc==="cooling"?1:12);

    if(/^(psi)$/.test(u)){ push(calc==="plates"?"q":"P",n,"psi","pressure"); continue; }
    if(/^rpm$/.test(u)){ push("rpm",n,"RPM","speed"); continue; }
    if(/^hp$/.test(u)){ push("hp",n,"HP","power"); continue; }
    if(/^gpm$/.test(u)){ push("gpm",n,"GPM","flow"); continue; }
    if(/^btu/.test(u)){ push("Q",n,"BTU/hr","heat load"); continue; }
    if(/^(lbf?|lbs|pounds?)$/.test(u)){
      push(calc==="bolts"||calc==="columns"?"P":"P",n,"lbf","load"); continue; }
    if(/^(in|inch|inches|"|ft|feet|mm)$/.test(u)){
      let key=null;
      for(const [re,k] of CTX) if(re.test(near)){ key=k; break; }
      if(!key) key = calc==="cooling"?"d":calc==="pressure"?"ID":calc==="plates"?"a":"L";
      if(calc==="cooling"&&/^(ft|feet)$/.test(u)) key="len";
      if(calc==="pressure"&&key==="d") key="ID";
      if(calc==="plates"&&key==="d") key="a";
      push(key,n,"in",/\b(long|length|span)\b/i.test(near)?"length":"dimension");
    }
  }

  // beam load case from how it's described
  if(calc==="beams"){
    const uni=/\b(uniform|distributed|spread|along|per inch|udl)\b/i.test(text);
    let c="ss_point";
    if(/\b(cantilever|one end|overhang|bracket|sticks? out|free end|hangs? off)\b/i.test(text)) c=uni?"cant_uniform":"cant_point";
    else if(/\b(both ends fixed|fixed[- ]fixed|welded both|built[- ]in both)\b/i.test(text)) c=uni?"fixed_uniform":"fixed_point";
    else c=uni?"ss_uniform":"ss_point";
    v.case=c; read.push(["case",BEAM_CASES[c][0],"","how it's supported"]);
    if(uni&&v.P!==undefined){ v.w=v.P; delete v.P;
      const i=read.findIndex(r=>r[0]==="P"); if(i>=0) read[i]=["w",v.w,"lbf/in","distributed load"]; }
  }
  if(calc==="columns"&&/\b(one end free|flag ?pole|cantilever|free at the top)\b/i.test(text)) v.end="ff";
  if(calc==="plates"&&/\b(clamped|bolted all round|welded all round|fixed edge)\b/i.test(text)) v.edge="clamped";
  if(calc==="plates"&&/\b(rectangular|square|panel)\b/i.test(text)) v.kind="rect";
  if(v.kind==="rect"&&v.a!==undefined){ v.la=v.a; delete v.a;
    const i=read.findIndex(r=>r[0]==="a"); if(i>=0) read[i]=["la",v.la,"in","long side"]; }
  if(calc==="sections"||calc==="beams"||calc==="columns"){
    if(v.d!==undefined) v.shape="round";
    else if(v.b!==undefined&&v.h!==undefined) v.shape="rectangle";
  }
  return {calc,confident,values:v,read,alts:ranked.filter(r=>r[1]>0).slice(1,4).map(r=>r[0])};
}

let startText="", parsed=null;
function renderStart(){
  $("#ctitle").textContent="Start here";
  $("#cdesc").textContent="Describe what you're sizing in plain language. Everything it picks up is shown before anything loads — correct it if it read you wrong.";
  $("#inputs").innerHTML=""; $("#diagram").style.display="none";
  const p=parsed;
  $("#results").innerHTML=`
   <div class="group">
     <p class="grouptitle">What are you working on?</p>
     <textarea id="q" class="enote" rows="3" style="min-height:74px"
       placeholder="A 6061 bracket, 8 in long, sticking off a plate, holding 200 lb at the free end">${esc(startText)}</textarea>
     <div class="actions" style="margin-top:10px">
       <button class="btn primary" id="qgo">Work out what to use</button>
       ${startText?'<button class="btn" id="qclear">Clear</button>':""}
     </div>
   </div>
   ${p?(p.calc?`
   <div class="group">
     <p class="grouptitle">What it read</p>
     <div class="ehead"><span class="ecalc">${CALCS[p.calc].title}</span>
       <span class="chip ${p.confident?"ok":"warn"}">${p.confident?"clear match":"best guess"}</span></div>
     ${p.read.length?`<div class="tablewrap"><table><thead><tr><th>Field</th><th>Value</th></tr></thead>
       <tbody>${p.read.map(([k,val,u,why])=>{
         const f=CALCS[p.calc].fields.find(x=>x.k===k);
         return `<tr><td>${f?f.l:k}<span class="unit">${why}</span></td>
           <td class="num">${typeof val==="number"?fmt(val):esc(val)}<span class="unit">${u}</span></td></tr>`;
       }).join("")}</tbody></table></div>`
      :`<p class="dgcap" style="border:0;padding:0;margin:0">No numbers found — it will open with the defaults.</p>`}
     <div class="actions">
       <button class="btn primary" id="qopen">Open in ${CALCS[p.calc].label}</button>
       ${p.alts.map(a=>`<button class="btn sm" data-alt="${a}">${CALCS[a].label} instead</button>`).join("")}
     </div>
   </div>`:`<div class="empty">Couldn't tell which calculator that needs.<br>
     Try naming the part and what it does — "bracket holding 200 lb", "cover plate under 150 psi",
     "3/8-16 bolt clamping a joint".</div>`):""}
   <div class="group">
     <p class="grouptitle">Or start from the part</p>
     <div class="actions">${Object.entries(CALCS).map(([k,c])=>
       `<button class="btn sm" data-alt="${k}">${c.label}</button>`).join("")}</div>
   </div>`;

  const go=()=>{ startText=$("#q").value; parsed=startText.trim()?parseQuery(startText):null; render(); };
  $("#qgo").onclick=go;
  $("#q").onkeydown=e=>{ if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)) go(); };
  if($("#qclear")) $("#qclear").onclick=()=>{startText="";parsed=null;render();};
  if($("#qopen")) $("#qopen").onclick=()=>{
    state[p.calc]={...defaults(p.calc),...p.values};
    current=p.calc; sweepKey=null; buildNav(); render();
  };
  $("#results").onclick=e=>{
    const a=e.target.closest("[data-alt]"); if(!a) return;
    const k=a.dataset.alt;
    if(p&&p.values) state[k]={...defaults(k),...Object.fromEntries(
      Object.entries(p.values).filter(([kk])=>CALCS[k].fields.some(f=>f.k===kk)))};
    current=k; sweepKey=null; buildNav(); render();
  };
}

/* ---- Findings -------------------------------------------------------------
   What is worth pointing out about a result. Deliberately rule-based, not a
   language model: "interesting" in sizing work has exact definitions — a margin
   that vanished, a section that is mostly along for the ride, a regime you are
   sitting right on top of. Rules are instant, offline, and cannot invent a
   concern that isn't there.                                                   */

function findings(calc,v,r){
  const F=[], sf=r.sf;
  const get=l=>{const row=r.rows.find(x=>x[0]===l); return row?row[1]:null;};

  if(sf!=null){
    if(sf<1) F.push(["alert",`Fails. At SF ${sf.toFixed(2)} the stress is above yield — this breaks as drawn.`]);
    else if(sf<1.5) F.push(["watch",`Thin margin. SF ${sf.toFixed(2)} leaves little for tolerance, material scatter, or a load you didn't plan for.`]);
    else if(sf>5) F.push(["watch",`Heavily overbuilt at SF ${sf.toFixed(2)}. Stress scales with the section, so a good deal of this material is doing nothing — worth a look if weight or cost matters.`]);
    else F.push(["good",`SF ${sf.toFixed(2)} — a normal working margin for static loading.`]);
  }

  if(calc==="beams"){
    const d=get("Max deflection"), a=get(`Allowable L/${v.limit}`);
    if(d!=null&&a){
      const util=d/a;
      if(util>1) F.push(["alert",`Stiffness governs, not strength. Deflection is ${util.toFixed(1)}× the L/${v.limit} limit — a stronger material won't help, you need more I.`]);
      else if(util>0.8&&sf>2) F.push(["watch",`Deflection is at ${(util*100).toFixed(0)}% of its limit while stress has plenty of margin — this is a stiffness problem, so chase moment of inertia rather than yield strength.`]);
    }
    const S=get("Section modulus S"), req=r.solved&&r.solved[0]&&r.solved[0][1];
    if(S&&req&&S>req*2.5) F.push(["watch",`The section is ${(S/req).toFixed(1)}× the modulus needed for SF ${v.sf}. Dropping a size is on the table.`]);
  }

  if(calc==="columns"){
    const sl=get("Slenderness KL/r"), Cc=get("Transition Cc");
    if(sl&&Cc&&Math.abs(sl-Cc)/Cc<0.12)
      F.push(["watch",`Sitting right on the Euler/Johnson transition (KL/r ${sl.toFixed(0)} vs Cc ${Cc.toFixed(0)}). Small changes in length or end fixity flip which equation governs — don't design to the edge here.`]);
    if(sf!=null&&sf>=1.5&&sf<3)
      F.push(["watch",`Buckling gives no warning before it happens, so the usual target is SF 3+, not the 1.5 you'd accept on a yield check.`]);
  }

  if(calc==="cooling"){
    const Re=get("Reynolds"), V=get("Velocity"), m=get("Pump margin");
    if(Re>3000&&Re<6000) F.push(["watch",`Re ${Math.round(Re).toLocaleString()} sits in the transition band. Flow here is unstable — heat transfer varies run to run. Push past 10,000 if the cooling matters.`]);
    if(Re>=10000) F.push(["good",`Fully turbulent at Re ${Math.round(Re).toLocaleString()} — this is where the heat transfer you want lives.`]);
    if(m!=null&&m>0&&m<1.5) F.push(["watch",`Only ${m.toFixed(2)} psi of pump margin. Any added fitting or fouling puts this circuit short.`]);
    if(V&&V>8) F.push(["watch",`${V.toFixed(1)} ft/s is fast — erosion becomes a real wear mechanism above about 10.`]);
  }

  if(calc==="pressure"){
    const r_=get("Radius r");
    if(r_&&v.t>r_/10*0.85&&v.t<=r_/10)
      F.push(["watch",`Wall is close to the r/10 thin-wall limit. The numbers are still valid but the assumption is nearly spent.`]);
    const per=get("Tensile load per bolt");
    if(per) F.push(["good",`Each cover bolt carries ${fmt(per)} lbf — take that to the Bolts calculator as the external load P.`]);
  }

  if(calc==="bolts"){
    const sep=get("Separation factor"), lf=get("Load factor to yield");
    if(sep!=null&&sep<2) F.push(["watch",`The joint opens at only ${sep.toFixed(2)}× the applied load. Separation, not bolt failure, is what governs here — raise preload or add bolts.`]);
    if(sep!=null&&lf!=null&&sep<lf)
      F.push(["good",`Separation (${sep.toFixed(1)}×) comes before yield (${lf.toFixed(1)}×) — the joint warns you by leaking or fretting before the bolt lets go, which is the behaviour you want.`]);
  }

  if(calc==="plates"){
    const d=get("Max deflection");
    if(d!=null&&d>v.t*0.35&&d<=v.t/2)
      F.push(["watch",`Deflection is ${(d/v.t*100).toFixed(0)}% of thickness — approaching where membrane action takes over and these formulas turn conservative.`]);
  }

  if(calc==="shafts"){
    const tau=get("Torsional shear"), sb=get("Bending stress");
    if(tau&&sb){
      if(tau>sb*2) F.push(["good",`Torsion dominates (${(tau/sb).toFixed(1)}× the bending stress) — this is a torque-driven design.`]);
      else if(sb>tau*2) F.push(["good",`Bending dominates (${(sb/tau).toFixed(1)}× the shear) — support spacing matters more than torque capacity here.`]);
    }
  }
  return F;
}

/* ---- Projects -------------------------------------------------------------
   A project is a named set of saved calcs, each with a note. Held in
   localStorage, which is per-browser — this does not follow you between your
   phone and your laptop. Export writes the whole thing out as markdown.      */

const KEY="napkin.v1";
let DB={v:1,active:null,projects:{}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function loadDB(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const p=JSON.parse(raw); if(p&&p.projects) DB=p;}
  }catch(e){ /* private mode or corrupt — carry on with an empty in-memory DB */ }
  if(!Object.keys(DB.projects).length) newProject("Untitled project",true);
  if(!DB.projects[DB.active]) DB.active=Object.keys(DB.projects)[0];
  saveDB();
}
function saveDB(){
  try{ localStorage.setItem(KEY,JSON.stringify(DB)); }
  catch(e){ toast("Couldn't save — browser storage is unavailable"); }
}
function newProject(name,quiet){
  const id=uid();
  DB.projects[id]={id,name:name||"Untitled project",created:Date.now(),entries:[]};
  DB.active=id; if(!quiet) saveDB(); return id;
}
const proj=()=>DB.projects[DB.active];

function saveEntry(){
  const c=CALCS[current], v=state[current];
  let r; try{ r=c.run(v); }catch(e){ toast("Fix the inputs first"); return; }
  const summary=r.rows.filter(([,val])=>typeof val==="number").slice(0,3)
    .map(([l,val,u])=>[l,val,u]);
  proj().entries.unshift({
    id:uid(),calc:current,inputs:{...v},note:"",
    sf:r.sf==null?null:r.sf,summary,created:Date.now(),
  });
  saveDB(); buildNav();
  toast(`Saved to ${proj().name}`);
}
function openEntry(id){
  const e=proj().entries.find(x=>x.id===id); if(!e) return;
  state[e.calc]={...defaults(e.calc),...e.inputs};
  current=e.calc; buildNav(); render();
}
function deleteEntry(id){
  proj().entries=proj().entries.filter(x=>x.id!==id);
  saveDB(); buildNav(); render();
}

let toastT;
function toast(msg){
  document.querySelector(".toast")?.remove();
  const el=document.createElement("div");
  el.className="toast"; el.textContent=msg; el.setAttribute("role","status");
  document.body.appendChild(el);
  clearTimeout(toastT); toastT=setTimeout(()=>el.remove(),2200);
}

function projectMarkdown(){
  const p=proj(), d=new Date(p.created);
  const L=[`# ${p.name}`,"",`${p.entries.length} calc${p.entries.length===1?"":"s"} · started ${d.toLocaleDateString()}`,""];
  if(!p.entries.length) L.push("_No calcs saved yet._");
  for(const e of [...p.entries].reverse()){
    const c=CALCS[e.calc]; let r;
    try{ r=c.run({...defaults(e.calc),...e.inputs}); }catch(_){ continue; }
    L.push("---","",`## ${c.title}`,"");
    if(e.note) L.push(e.note,"");
    L.push("| Input | Value | Unit |","| --- | --- | --- |");
    const vv={...defaults(e.calc),...e.inputs};
    for(const f of c.fields.filter(f=>!f.show||f.show(vv))){
      const lbl=f.t==="select"?(f.o.find(o=>String(o[0])===String(vv[f.k]))||[,vv[f.k]])[1]:vv[f.k];
      L.push(`| ${f.l} | ${lbl} | ${f.u||""} |`);
    }
    L.push("",`\`${r.formula}\``,"");
    L.push("| Result | Value | Unit |","| --- | --- | --- |");
    for(const [l,val,u] of r.rows) L.push(`| ${l} | ${fmt(val)} | ${u} |`);
    if(r.sf!=null) L.push(`| **Safety factor** | **${r.sf.toFixed(2)}** | ${word(r.sf)} |`);
    if(r.solved) for(const [l,val,u] of r.solved) L.push(`| ${l} | ${fmt(val)} | ${u} |`);
    if(r.warn.length){ L.push(""); for(const [,t] of r.warn) L.push(`> **${t}**`); }
    L.push("");
  }
  L.push("---","","_Preliminary sizing from Napkin — Shigley and Roark closed-form. Not fatigue, not code work._");
  return L.join("\n");
}

function renderProject(){
  const p=proj();
  $("#ctitle").textContent="Project";
  $("#cdesc").textContent="Saved calcs, each with a note. Everything here lives in this browser only.";
  $("#inputs").innerHTML=""; $("#diagram").style.display="none";
  $("#results").innerHTML=`
   <div class="pbar">
     <select id="psel" aria-label="Active project">${Object.values(DB.projects)
       .map(x=>`<option value="${x.id}"${x.id===DB.active?" selected":""}>${esc(x.name)} (${x.entries.length})</option>`).join("")}</select>
     <button class="btn sm" id="pnew">New project</button>
     <button class="btn sm" id="prename">Rename</button>
     <span class="espacer"></span>
     <button class="btn sm" id="pcopy">Copy all as markdown</button>
     ${HAS_DL?'<button class="btn sm" id="pdl">Save .md file</button>':""}
     ${HAS_MCP?'<button class="btn sm" id="pnotion">Send to Notion</button>':""}
     <button class="btn sm danger" id="pdel">Delete project</button>
   </div>
   ${HAS_MCP?`<div class="group" style="margin-bottom:12px">
     <p class="grouptitle">Notion parent page</p>
     <div class="field wide"><label for="np">Paste a Notion page URL. New pages land inside it; leave it empty and they're created as private workspace pages.</label>
       <input id="np" type="text" placeholder="https://notion.so/…" value="${esc(notionParent())}"></div>
   </div>`:""}
   ${p.entries.length?p.entries.map(e=>{
     const c=CALCS[e.calc];
     return `<div class="entry" data-id="${e.id}">
      <div class="ehead"><span class="ecalc">${c.title}</span>
        ${e.sf!=null?`<span class="chip ${cls(e.sf)}">SF ${e.sf.toFixed(2)}</span>`:""}
        <span class="espacer"></span>
        <span class="emeta">${new Date(e.created).toLocaleDateString()}</span></div>
      <div class="esum">${e.summary.map(([l,val,u])=>{
        const [cv,cu]=conv(val,u); return `<span>${l} <b>${fmt(cv)}</b> ${cu||""}</span>`;}).join("")}</div>
      <textarea class="enote" data-note="${e.id}" placeholder="What is this for? What did you decide?"
        rows="1">${esc(e.note)}</textarea>
      <div class="eacts">
        <button class="btn sm" data-open="${e.id}">Open in ${c.label}</button>
        <button class="btn sm danger" data-del="${e.id}">Delete</button>
      </div></div>`;}).join(""):
    `<div class="empty">Nothing saved yet.<br>Run a calc, then press <b>Save to project</b>.</div>`}`;

  $("#psel").onchange=e=>{DB.active=e.target.value;saveDB();buildNav();render();};
  $("#pnew").onclick=()=>{const n=prompt("Project name","Untitled project");
    if(n!==null){newProject(n.trim()||"Untitled project");buildNav();render();}};
  $("#prename").onclick=()=>{const n=prompt("Project name",p.name);
    if(n!==null&&n.trim()){p.name=n.trim();saveDB();buildNav();render();}};
  $("#pdel").onclick=()=>{
    if(Object.keys(DB.projects).length<2){toast("That's your only project");return;}
    if(!confirm(`Delete "${p.name}" and its ${p.entries.length} saved calc(s)? This cannot be undone.`))return;
    delete DB.projects[DB.active]; DB.active=Object.keys(DB.projects)[0];
    saveDB(); buildNav(); render();
  };
  $("#pcopy").onclick=()=>navigator.clipboard.writeText(projectMarkdown())
    .then(()=>toast("Project copied — paste it into a Claude project"))
    .catch(()=>toast("Copy failed"));
  if($("#pdl")) $("#pdl").onclick=downloadProject;
  if($("#pnotion")) $("#pnotion").onclick=e=>sendToNotion(p.name,projectMarkdown(),e.target);
  if($("#np")) $("#np").oninput=e=>setNotionParent(e.target.value.trim());

  for(const t of document.querySelectorAll(".enote")){
    autoGrow(t);
    t.oninput=()=>{const e=p.entries.find(x=>x.id===t.dataset.note);
      if(e){e.note=t.value;saveDB();} autoGrow(t);};
  }
  $("#results").onclick=ev=>{
    const o=ev.target.closest("[data-open]"), d=ev.target.closest("[data-del]");
    if(o) openEntry(o.dataset.open);
    if(d&&confirm("Delete this calc?")) deleteEntry(d.dataset.del);
  };
}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function autoGrow(t){t.style.height="auto";t.style.height=Math.max(38,t.scrollHeight)+"px";}

/* ---- Notion ---------------------------------------------------------------
   Request and response shapes were observed against the real connector, not
   guessed: create-pages takes {parent:{type:"page_id",page_id}, pages:[{
   properties:{title}, icon, content}]} and returns {pages:[{id,url,...}]}.
   The parent page is entered by the user and kept in localStorage — no page id
   from anyone's workspace is baked into this file.                           */

// Notion and file-save come from the Claude artifact runtime. Self-hosted, that
// runtime isn't there — probe once at load and hide those affordances rather
// than offering buttons that can only fail.
let HAS_MCP=false, HAS_DL=false;
async function probeCapabilities(){
  try{ HAS_MCP = !!(await (window.claude?.use?.("mcp") ?? null)); }catch(_){}
  try{ HAS_DL  = !!(await (window.claude?.use?.("downloads") ?? null)); }catch(_){}
  if(HAS_MCP||HAS_DL) render();
}

const NOTION_SERVER="claude_ai_Notion";
const notionParent=()=>{ try{return localStorage.getItem("napkin.notionParent")||"";}catch(_){return "";} };
function setNotionParent(v){ try{localStorage.setItem("napkin.notionParent",v);}catch(_){} }
const pageIdFrom=s=>{
  const m=String(s).match(/([0-9a-f]{32})|([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/i);
  return m?m[0]:"";
};

async function sendToNotion(title,markdown,btn){
  const mcp=await (window.claude?.use?.("mcp")??null);
  if(!mcp){ toast("Notion isn't available in this view — use Copy instead"); return; }
  const parent=pageIdFrom(notionParent());
  if(btn){ btn.disabled=true; btn.textContent="Sending…"; }
  try{
    const res=await mcp.callTool(NOTION_SERVER,"notion-create-pages",{
      ...(parent?{parent:{type:"page_id",page_id:parent}}:{}),
      pages:[{properties:{title},icon:"📐",content:markdown}],
    });
    const url=res?.payload?.pages?.[0]?.url;
    toast(url?"Sent to Notion":"Sent");
    if(url) window.open(url,"_blank","noopener");
  }catch(err){
    const c=err&&err.code;
    if(c==="tool_error") toast("Notion rejected it — check the parent page is one you can edit");
    else if(c==="declined"||c==="not_granted") toast("Notion access wasn't granted");
    else toast("Couldn't reach Notion — the markdown is still yours to copy");
  }finally{ if(btn){ btn.disabled=false; btn.textContent="Send to Notion"; } }
}

async function downloadProject(){
  const dl=await (window.claude?.use?.("downloads")??null);
  if(!dl){ toast("File saving isn't available here — use Copy instead"); return; }
  const name=proj().name.replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-")||"napkin-project";
  try{ await dl.save({filename:`${name}.md`,data:projectMarkdown()}); toast("Saved"); }
  catch(err){
    const c=err&&err.code;
    if(c==="declined") return;
    if(c==="rate_limited") toast("A save prompt is already open");
    else toast("Couldn't save the file — use Copy instead");
  }
}

let current="__start", state={};
const $=s=>document.querySelector(s);

function defaults(calc){
  const v={}; for(const f of CALCS[calc].fields) v[f.k]=f.d; return v;
}
function visible(calc){
  return CALCS[calc].fields.filter(f=>!f.show||f.show(state[calc]));
}

function buildNav(){
  const n=proj()?proj().entries.length:0;
  $("#nav").innerHTML=`<li><button data-c="__start" ${current==="__start"?'aria-current="true"':""}>Start
     <span class="op">↦</span></button></li><li><div class="navsep"></div></li>`
   +Object.entries(CALCS).map(([k,c])=>
   `<li><button data-c="${k}" ${k===current?'aria-current="true"':""}>${c.label}<span class="op">${c.op}</span></button></li>`).join("")
   +`<li><div class="navsep"></div></li>
     <li><button data-c="__project" ${current==="__project"?'aria-current="true"':""}>Project
       <span class="savedcount">${n}</span></button></li>`;
  $("#nav").onclick=e=>{const b=e.target.closest("button"); if(!b)return;
   if(b.dataset.c!==current) sweepKey=null;  // a key from one calc means nothing in another
   current=b.dataset.c; buildNav(); render();};
}

function render(){
  if(current==="__start"){ renderStart(); return; }
  if(current==="__project"){ renderProject(); return; }
  const c=CALCS[current], v=state[current];
  $("#ctitle").textContent=c.title; $("#cdesc").textContent=c.desc;
  $("#results").onclick=null;

  $("#inputs").innerHTML=`<fieldset class="group"><p class="grouptitle">Inputs</p>${
   visible(current).map(f=>{
    const val=v[f.k];
    if(f.t==="select") return `<div class="field wide"><label for="i-${f.k}">${f.l}${info(f.l)}</label>
      <select id="i-${f.k}" data-k="${f.k}">${f.o.map(([ov,ol])=>
        `<option value="${ov}"${String(ov)===String(val)?" selected":""}>${ol}</option>`).join("")}</select></div>`;
    const [dv,du]=conv(val,f.u);
    return `<div class="field"><label for="i-${f.k}">${f.l}${info(f.l)}${f.u?` <span class="u">${du||f.u}</span>`:""}</label>
      <input id="i-${f.k}" data-k="${f.k}" data-unit="${f.u||""}" type="number" step="any" value="${
        typeof dv==="number"?+dv.toFixed(6):dv}"></div>${sliderFor(f)}`;
   }).join("")}</fieldset>`;

  let r;
  try{ r=c.run(v); }
  catch(err){ $("#results").innerHTML=`<div class="note fail"><b>Check the inputs.</b> ${err.message}</div>`; return; }

  const sf=r.sf, target=r.sfTarget||1.5;
  const pct=sf==null?0:Math.min(sf/3,1)*100;
  const gauge=sf==null?"":`<div class="gauge">
    <div class="gtrack"><div class="gfill" style="width:${pct}%;background:var(--${cls(sf)})"></div>
      <div class="gmark" style="left:33.3%"></div><div class="gmark" style="left:50%"></div></div>
    <div class="gscale"><span>0</span><span>1.0</span><span>1.5</span><span>3.0+</span></div></div>`;

  const row=([l,val,u])=>{const [cv,cu]=conv(val,u);
    return `<tr><td>${termHtml(l)}</td><td class="num">${fmt(cv)}${cu?`<span class="unit">${cu}</span>`:""}</td></tr>`;};

  $("#results").innerHTML=`
   ${sf!==null?`<div class="verdict"><div class="vtop">
     <div class="sfblock"><div class="sflabel">${termHtml("Safety factor")}</div>
       <div class="sfval" style="color:var(--${cls(sf)})">${sf==null?"—":sf.toFixed(2)}</div>
       <span class="chip ${cls(sf)}">${word(sf)}</span></div>
     ${gauge}</div></div>`:""}
   <div class="group"><p class="grouptitle">Results</p>
     <div class="tablewrap"><table><thead><tr><th>Quantity</th><th>Value</th></tr></thead>
     <tbody>${r.rows.map(row).join("")}</tbody></table></div>
     <div class="formula">${r.formula}</div>
     ${r.warn.map(([k,t])=>`<div class="note ${k}">${t}</div>`).join("")}
   </div>
   ${(()=>{const F=findings(current,v,r); return F.length?`<div class="group">
     <p class="grouptitle">What stands out</p>
     ${F.map(([k,t])=>`<div class="finding ${k}"><span class="mk">${
       k==="alert"?"!":k==="watch"?"~":"+"}</span><span>${t}</span></div>`).join("")}
   </div>`:"";})()}
   ${r.solved?`<div class="group"><p class="grouptitle">Sized for SF ${v.sf}</p>
     <div class="tablewrap"><table><tbody>${r.solved.map(row).join("")}</tbody></table></div></div>`:""}
   <div class="actions">
     <button class="btn primary" id="save">Save to project</button>
     <button class="btn" id="preview">Preview &amp; copy…</button>
     <button class="btn" id="reset">Reset inputs</button>
   </div>`;

  renderDiagram();
  $("#save").onclick=saveEntry;
  $("#preview").onclick=openPreview;
  $("#reset").onclick=()=>{state[current]=defaults(current);render();};
}

/* ---- Export at four levels of detail --------------------------------------
   answer   one line, for a slide
   standard inputs, formula, headline results — a white-paper paragraph
   full     every intermediate, the back-solve, the assumptions
   claude   full, plus the context a model needs to write prose about it     */

const LEVELS=[["answer","Answer"],["standard","Standard"],["full","Full work"],["claude","For Claude"]];

function exportMd(level,calcKey,inputs){
  const key=calcKey||current, c=CALCS[key];
  const v=inputs?{...defaults(key),...inputs}:state[key];
  const r=c.run(v);
  const F=findings(key,v,r);
  const fields=c.fields.filter(f=>!f.show||f.show(v));
  const lbl=f=>f.t==="select"?(f.o.find(o=>String(o[0])===String(v[f.k]))||[,v[f.k]])[1]:v[f.k];
  const head=r.rows.filter(([,x])=>typeof x==="number");
  const L=[];

  if(level==="answer"){
    // lowercase only the leading letter — "Max moment M" must not become "max moment m"
    const bits=head.slice(0,2).map(([l,x,u])=>`${l[0].toLowerCase()+l.slice(1)} ${fmt(x)} ${u}`).join(", ");
    L.push(`**${c.title}** — ${bits}${r.sf!=null?`, safety factor **${r.sf.toFixed(2)}** (${word(r.sf)})`:""}.`);
    return L.join("\n");
  }

  L.push(`### ${c.title}`,"");
  if(level==="claude"){
    L.push(`<!-- Napkin — preliminary sizing. ${c.reference||"Shigley / Roark closed-form."}`,
      `     Static, elastic, small-deflection, room temperature. US customary.`,
      `     This is a first-pass check, NOT fatigue, stress concentration, or code work. -->`,"");
  }
  L.push("**Inputs**","","| Input | Value | Unit |","| --- | --- | --- |");
  for(const f of fields) L.push(`| ${f.l} | ${lbl(f)} | ${f.u||""} |`);
  L.push("",`\`${r.formula}\``,"");
  L.push("**Results**","","| Result | Value | Unit |","| --- | --- | --- |");
  const rows=level==="standard"?r.rows.slice(0,5):r.rows;
  for(const [l,x,u] of rows) L.push(`| ${l} | ${fmt(x)} | ${u} |`);
  if(r.sf!=null) L.push(`| **Safety factor** | **${r.sf.toFixed(2)}** | ${word(r.sf)} |`);
  if(level!=="standard"&&r.solved){
    L.push("",`**Sized for SF ${v.sf}**`,"","| Quantity | Value | Unit |","| --- | --- | --- |");
    for(const [l,x,u] of r.solved) L.push(`| ${l} | ${fmt(x)} | ${u} |`);
  }
  if(F.length){
    L.push("","**What stands out**","");
    for(const [k,t] of F) L.push(`- ${k==="alert"?"**":""}${t}${k==="alert"?"**":""}`);
  }
  if(r.warn.length){ L.push(""); for(const [,t] of r.warn) L.push(`> ${t}`); }
  if(level==="claude"){
    L.push("","**For the model**","",
      "- Every number above is computed, not estimated — quote them as given.",
      "- The safety factor is on yield, static loading only.",
      "- Items under *What stands out* are the engineering judgement worth expanding on; the rest is arithmetic.",
      "- If asked to write this up, lead with what governs the design, then the margin, then what would change it.");
  }
  return L.join("\n");
}

let previewLevel="standard";
function openPreview(){
  const scrim=document.createElement("div");
  scrim.className="scrim"; scrim.setAttribute("role","dialog"); scrim.setAttribute("aria-label","Preview export");
  const draw=()=>{
    scrim.innerHTML=`<div class="modal">
      <div class="mhead"><h3>Preview</h3>
        <div class="levels" role="group" aria-label="Detail level">${LEVELS.map(([k,l])=>
          `<button data-l="${k}" aria-pressed="${k===previewLevel}">${l}</button>`).join("")}</div>
      </div>
      <div class="mbody"><pre>${esc(exportMd(previewLevel))}</pre></div>
      <div class="mfoot">
        <span class="hint">${
          previewLevel==="answer"?"One sentence — for a slide or a caption.":
          previewLevel==="standard"?"Inputs, formula and headline numbers. The white-paper default.":
          previewLevel==="full"?"Every intermediate, the back-solve, and the assumptions.":
          "Full work plus the framing a model needs to write prose about it without inventing anything."}</span>
        <button class="btn" data-x="close">Close</button>
        ${HAS_MCP?'<button class="btn" data-x="notion">Send to Notion</button>':""}
        <button class="btn primary" data-x="copy">Copy</button>
      </div></div>`;
  };
  draw();
  scrim.onclick=e=>{
    if(e.target===scrim||e.target.dataset.x==="close"){scrim.remove();document.removeEventListener("keydown",esckey);return;}
    const l=e.target.dataset.l;
    if(l){previewLevel=l;draw();return;}
    if(e.target.dataset.x==="copy")
      navigator.clipboard.writeText(exportMd(previewLevel))
        .then(()=>{toast("Copied");scrim.remove();document.removeEventListener("keydown",esckey);})
        .catch(()=>toast("Copy failed"));
    if(e.target.dataset.x==="notion")
      sendToNotion(CALCS[current].title,exportMd(previewLevel),e.target);
  };
  const esckey=e=>{if(e.key==="Escape"){scrim.remove();document.removeEventListener("keydown",esckey);}};
  document.addEventListener("keydown",esckey);
  document.body.appendChild(scrim);
}

/* ---- Sliders and the sensitivity curve ------------------------------------
   Typing a number answers "what is it here". Dragging answers "which way does
   it go, and how fast" — which is usually the question you actually have.    */

const SLIDE={
 beams:{L:[4,120],P:[0,4000],w:[0,150],b:[.125,6],h:[.125,8],d:[.125,6],od:[.25,8],
   H:[1,12],B:[.5,8],tf:[.06,1],tw:[.06,1]},
 plates:{a:[.5,12],la:[1,24],sb:[1,24],q:[0,1500],t:[.03,3]},
 columns:{L:[2,120],P:[0,30000],b:[.125,6],h:[.125,6],d:[.125,6],od:[.25,8]},
 shafts:{d:[.125,4],M:[0,4000],hp:[0,100],rpm:[100,6000],L:[1,60]},
 bolts:{frac:[.3,.95],P:[0,12000],C:[.05,.6],V:[0,8000]},
 pressure:{ID:[.5,36],t:[.02,2],P:[0,3000]},
 cooling:{d:[.125,2],gpm:[.1,20],len:[1,80],temp:[50,180],K:[0,30]},
 sections:{b:[.125,6],h:[.125,8],d:[.125,6],od:[.25,8],H:[1,12],B:[.5,8]},
};
let sweepKey=null;

function sliderFor(f){
  const rng=(SLIDE[current]||{})[f.k];
  if(!rng||f.t==="select") return "";
  const v=state[current][f.k];
  const [lo,hi]=rng, step=(hi-lo)/200;
  return `<div class="slider">
    <input type="range" data-slide="${f.k}" min="${lo}" max="${hi}" step="${step}"
      value="${Math.min(Math.max(v,lo),hi)}" aria-label="${f.l} slider">
    <button data-sweep="${f.k}" aria-pressed="${sweepKey===f.k}" title="Plot safety factor against this">plot</button>
  </div>`;
}

function curveSvg(){
  if(!sweepKey) return "";
  const rng=(SLIDE[current]||{})[sweepKey]; if(!rng) return "";
  const c=CALCS[current], base=state[current], f=c.fields.find(x=>x.k===sweepKey);
  const [lo,hi]=rng, N=64, pts=[];
  for(let i=0;i<=N;i++){
    const x=lo+(hi-lo)*i/N;
    let sf=null; try{ sf=c.run({...base,[sweepKey]:x}).sf; }catch(_){}
    if(sf!=null&&isFinite(sf)&&sf>0) pts.push([x,Math.min(sf,6)]);
  }
  if(pts.length<3) return "";
  const W=300,H=92,PL=26,PR=6,PT=8,PB=16;
  const sx=x=>PL+(x-lo)/(hi-lo)*(W-PL-PR);
  const sy=s=>PT+(1-s/6)*(H-PT-PB);
  const path=pts.map(([x,s],i)=>`${i?"L":"M"}${sx(x).toFixed(1)},${sy(s).toFixed(1)}`).join("");
  const cur=base[sweepKey];
  let curSf=null; try{ curSf=c.run(base).sf; }catch(_){}
  const thr=(s,col)=>`<line class="cv-thr" x1="${PL}" y1="${sy(s)}" x2="${W-PR}" y2="${sy(s)}" stroke="${col}"/>`;
  return `<div class="curve">
    <div class="curvehead"><span class="curvetitle">Safety factor vs ${esc(f.l)}</span>
      <span class="curveval">${curSf!=null?curSf.toFixed(2):"—"} at ${fmt(cur)} ${f.u||""}</span></div>
    <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">
      <line class="cv-grid" x1="${PL}" y1="${sy(0)}" x2="${W-PR}" y2="${sy(0)}"/>
      ${thr(1,"var(--fail)")}${thr(1.5,"var(--warn)")}
      <text class="cv-txt" x="${PL-4}" y="${sy(1)+3}" text-anchor="end">1.0</text>
      <text class="cv-txt" x="${PL-4}" y="${sy(1.5)+3}" text-anchor="end">1.5</text>
      <path class="cv-line" d="${path}"/>
      ${curSf!=null&&isFinite(curSf)?`<circle class="cv-dot" cx="${sx(Math.min(Math.max(cur,lo),hi)).toFixed(1)}"
        cy="${sy(Math.min(curSf,6)).toFixed(1)}" r="4"/>`:""}
      <text class="cv-txt" x="${PL}" y="${H-4}">${fmt(lo)}</text>
      <text class="cv-txt" x="${W-PR}" y="${H-4}" text-anchor="end">${fmt(hi)} ${esc(f.u||"")}</text>
    </svg></div>`;
}

function copyMd(r){
  const c=CALCS[current], v=state[current];
  const L=[`### ${c.title}`,""];
  L.push("| Input | Value | Unit |","| --- | --- | --- |");
  for(const f of visible(current)){
    const lbl=f.t==="select"?(f.o.find(o=>String(o[0])===String(v[f.k]))||[,v[f.k]])[1]:v[f.k];
    L.push(`| ${f.l} | ${lbl} | ${f.u||""} |`);
  }
  L.push("",`\`${r.formula}\``,"");
  L.push("| Result | Value | Unit |","| --- | --- | --- |");
  for(const [l,val,u] of r.rows) L.push(`| ${l} | ${fmt(val)} | ${u} |`);
  if(r.sf!=null) L.push(`| Safety factor | ${r.sf.toFixed(2)} | ${word(r.sf)} |`);
  if(r.solved) for(const [l,val,u] of r.solved) L.push(`| ${l} | ${fmt(val)} | ${u} |`);
  if(r.warn.length){L.push("");for(const [,t] of r.warn) L.push(`> **${t}**`);}
  const text=L.join("\n");
  navigator.clipboard.writeText(text).then(()=>{
    const b=$("#copy"); b.textContent="Copied"; setTimeout(()=>b.textContent="Copy as markdown",1400);
  }).catch(()=>{ const b=$("#copy"); b.textContent="Copy failed"; });
}

document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.slide&&state[current]){
    // Sliders are always in native US units — they bypass the metric conversion
    // the typed fields go through.
    state[current][el.dataset.slide]=parseFloat(el.value);
    const k=el.dataset.slide; render();
    const s=document.querySelector(`[data-slide="${k}"]`); if(s) s.focus();
    return;
  }
  if(!el.dataset.k||!state[current]) return;
  const v=state[current];
  v[el.dataset.k]=el.type==="number"?parseFloat(el.value)||0:el.value;
  if(metric&&el.dataset.unit){
    const u=el.dataset.unit, c=SI[u];
    if(c) v[el.dataset.k]= u==="F" ? (parseFloat(el.value)*1.8+32) : parseFloat(el.value)/c[0];
  }
  if(el.tagName==="SELECT") render(); else renderResultsOnly();
});
function renderResultsOnly(){
  // A full re-render is cheap here, but it destroys the node being typed into.
  // Restore focus to the same field on the same side — a diagram field must not
  // hand focus to the sidebar field that shares its key.
  const a=document.activeElement, k=a?.dataset?.k, dg=a?.dataset?.dg;
  render();
  if(!k) return;
  const el=document.querySelector(dg?`[data-k="${k}"][data-dg]`:`#inputs [data-k="${k}"]`);
  if(el) el.focus();
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-sweep]"); if(!b) return;
  sweepKey = sweepKey===b.dataset.sweep ? null : b.dataset.sweep;
  render();
});

function selfCheck(){
  let bad=[];
  for(const [name,fn,want] of VECTORS){
    let got; try{got=fn();}catch(e){bad.push(name);continue;}
    if(got==null||Math.abs(got-want)>Math.abs(want)*1e-9+1e-12) bad.push(name);
  }
  const el=$("#check");
  if(bad.length){
    el.textContent=`${bad.length}/${VECTORS.length} checks FAILED: ${bad.slice(0,3).join(", ")}`;
    el.style.background="var(--fail-bg)"; el.style.color="var(--fail)";
  } else {
    el.textContent=`${VECTORS.length}/${VECTORS.length} checks match the spreadsheet`;
    el.style.background="var(--ok-bg)"; el.style.color="var(--ok)";
  }
}
