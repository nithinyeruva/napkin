<title>Napkin</title>
<style>
:root{
  --paper:#FAFAFB; --card:#FFFFFF; --sunk:#F2F3F6;
  --ink:#141821; --ink-2:#4A5260; --ink-3:#7C8492;
  --rule:#E0E3E9; --rule-2:#CBD0DA;
  --dye:#1F4E8C; --dye-soft:#E8EEF7;
  --ok:#2E7D4F; --ok-bg:#E8F3EC;
  --warn:#B0761A; --warn-bg:#FAF1DF;
  --fail:#B03A32; --fail-bg:#FBEAE8;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1319; --card:#161B23; --sunk:#1D232C;
    --ink:#E6E9EF; --ink-2:#9DA6B4; --ink-3:#6D7686;
    --rule:#262D38; --rule-2:#333C4A;
    --dye:#6EA3E0; --dye-soft:#1A2634;
    --ok:#5FBF87; --ok-bg:#152318;
    --warn:#D9A441; --warn-bg:#241D10;
    --fail:#E0736A; --fail-bg:#2A1614;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1319; --card:#161B23; --sunk:#1D232C;
  --ink:#E6E9EF; --ink-2:#9DA6B4; --ink-3:#6D7686;
  --rule:#262D38; --rule-2:#333C4A;
  --dye:#6EA3E0; --dye-soft:#1A2634;
  --ok:#5FBF87; --ok-bg:#152318;
  --warn:#D9A441; --warn-bg:#241D10;
  --fail:#E0736A; --fail-bg:#2A1614;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--ui); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1440px;margin:0 auto;padding:0 20px 64px}

header{
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  padding:26px 0 18px;border-bottom:2px solid var(--ink);margin-bottom:0;
}
h1{font-size:26px;letter-spacing:-.02em;margin:0;font-weight:640}
.tag{font-size:12px;color:var(--ink-2);letter-spacing:.02em}
.spacer{flex:1}
.toggle{display:flex;border:1px solid var(--rule-2);border-radius:7px;overflow:hidden}
.toggle button{
  font:inherit;font-size:12px;padding:5px 11px;border:0;cursor:pointer;
  background:var(--card);color:var(--ink-2);
}
.toggle button[aria-pressed="true"]{background:var(--dye);color:#fff}
.toggle button:focus-visible{outline:2px solid var(--dye);outline-offset:-2px}

.layout{display:grid;grid-template-columns:186px 1fr;gap:0;align-items:start}
nav{
  border-right:1px solid var(--rule);padding:16px 14px 16px 0;
  position:sticky;top:0;
}
.navlabel{
  font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 8px 2px;font-weight:600;
}
nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
nav button{
  width:100%;text-align:left;font:inherit;font-size:14px;
  padding:6px 10px;border:0;border-radius:6px;cursor:pointer;
  background:transparent;color:var(--ink-2);
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
nav button:hover{background:var(--sunk);color:var(--ink)}
nav button[aria-current="true"]{background:var(--dye);color:#fff;font-weight:560}
nav button:focus-visible{outline:2px solid var(--dye);outline-offset:1px}
nav .op{font-family:var(--mono);font-size:10px;opacity:.55}

main{padding:22px 0 0 28px;min-width:0}
.calchead{margin-bottom:18px}
.calchead h2{font-size:19px;margin:0 0 3px;letter-spacing:-.01em;font-weight:620}
.calchead p{margin:0;font-size:13px;color:var(--ink-2);max-width:62ch}

.cols{display:grid;grid-template-columns:minmax(0,272px) minmax(0,360px) minmax(0,1fr);gap:22px;align-items:start}

/* Diagram — schematic, with the dimensions you can type into sitting on it */
.diagram{
  background:var(--card);border:1px solid var(--rule);border-radius:10px;
  padding:14px 15px 12px;position:sticky;top:14px;
}
.dgwrap{position:relative;width:100%}
.dgwrap svg{display:block;width:100%;height:auto}
.dg-line{stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round}
.dg-thin{stroke:var(--ink-3);stroke-width:1;fill:none}
.dg-dim{stroke:var(--dye);stroke-width:1;fill:none}
.dg-load{stroke:var(--dye);stroke-width:1.6;fill:none;stroke-linecap:round}
.dg-fill{fill:var(--dye-soft);stroke:var(--dye);stroke-width:1.5}
.dg-body{fill:var(--sunk);stroke:var(--ink);stroke-width:1.5}
.dg-defl{stroke:var(--warn);stroke-width:1.6;fill:none;stroke-dasharray:4 3}
.dg-hatch{stroke:var(--ink-3);stroke-width:1}
.dg-txt{fill:var(--ink-2);font-family:var(--mono);font-size:10px}
.dg-key{fill:var(--dye);font-family:var(--mono);font-size:10px;font-weight:600}
.dgfield{
  position:absolute;transform:translate(-50%,-50%);
  display:flex;align-items:center;gap:3px;
  background:var(--card);border:1px solid var(--rule-2);border-radius:5px;
  padding:1px 3px 1px 5px;box-shadow:0 1px 3px rgba(0,0,0,.07);
}
.dgfield span{font-family:var(--mono);font-size:10px;color:var(--dye);font-weight:600}
.dgfield input{
  width:52px;padding:1px 3px;border:0;background:transparent;
  font-family:var(--mono);font-size:11px;text-align:right;color:var(--ink);
}
.dgfield input:focus{outline:1.5px solid var(--dye);outline-offset:1px;border-radius:3px}
.dgcap{
  font-size:11px;color:var(--ink-3);margin:9px 0 0;line-height:1.4;
  padding-top:9px;border-top:1px solid var(--rule);
}
.dglegend{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--ink-3);margin-top:7px}
.dglegend i{display:inline-block;width:14px;height:0;border-top:2px dashed var(--warn);
  vertical-align:middle;margin-right:4px}

fieldset{border:0;margin:0;padding:0}
.group{
  background:var(--card);border:1px solid var(--rule);border-radius:10px;
  padding:14px 15px;
}
.group + .group{margin-top:12px}
.grouptitle{
  font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;margin:0 0 10px;
}
.field{display:grid;grid-template-columns:1fr 108px;gap:8px;align-items:center;margin-bottom:9px}
.field:last-child{margin-bottom:0}
.field label{font-size:13px;color:var(--ink-2);line-height:1.3}
.field .u{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
input,select{
  font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;
  width:100%;padding:5px 8px;border:1px solid var(--rule-2);border-radius:6px;
  background:var(--paper);color:var(--ink);
}
select{font-family:var(--ui);font-size:12.5px}
input:focus,select:focus{outline:2px solid var(--dye);outline-offset:-1px;border-color:var(--dye)}
.wide{grid-template-columns:1fr}
.wide label{margin-bottom:2px}

.verdict{
  background:var(--card);border:1px solid var(--rule);border-radius:10px;
  padding:16px 18px;margin-bottom:12px;
}
.vtop{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.sfblock{min-width:120px}
.sflabel{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.sfval{
  font-family:var(--mono);font-size:38px;line-height:1.05;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;margin-top:2px;
}
.chip{
  display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;
  padding:3px 9px;border-radius:5px;font-weight:600;margin-top:6px;
}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.fail{background:var(--fail-bg);color:var(--fail)}
.chip.none{background:var(--sunk);color:var(--ink-3)}

.gauge{flex:1;min-width:200px;padding-top:8px}
.gtrack{position:relative;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.gfill{position:absolute;inset:0 auto 0 0;border-radius:4px;transition:width .18s ease}
.gmark{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--rule-2)}
.gscale{
  display:flex;justify-content:space-between;font-family:var(--mono);
  font-size:10px;color:var(--ink-3);margin-top:5px;
}

table{width:100%;border-collapse:collapse;font-size:13.5px}
.tablewrap{overflow-x:auto}
th{
  text-align:left;font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;padding:0 0 7px;border-bottom:1px solid var(--rule);
}
th:last-child,td:last-child{text-align:right}
td{padding:6px 0;border-bottom:1px solid var(--rule);color:var(--ink-2)}
td:first-child{color:var(--ink)}
tr:last-child td{border-bottom:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.unit{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:5px}

.formula{
  font-family:var(--mono);font-size:12px;color:var(--ink-2);
  background:var(--sunk);border-radius:7px;padding:9px 11px;margin-top:12px;
  overflow-x:auto;white-space:nowrap;
}
.note{
  display:flex;gap:9px;font-size:12.5px;line-height:1.45;
  border-radius:7px;padding:9px 11px;margin-top:8px;
}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.fail{background:var(--fail-bg);color:var(--fail)}
.note b{font-weight:600}
.note::before{content:"!";font-family:var(--mono);font-weight:700;flex:none}

.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{
  font:inherit;font-size:12.5px;padding:6px 13px;border-radius:7px;cursor:pointer;
  border:1px solid var(--rule-2);background:var(--card);color:var(--ink);
}
.btn:hover{border-color:var(--dye);color:var(--dye)}
.btn:focus-visible{outline:2px solid var(--dye);outline-offset:1px}
.btn.primary{background:var(--dye);border-color:var(--dye);color:#fff}
.btn.primary:hover{opacity:.9;color:#fff}

/* Sliders */
.slider{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin:-3px 0 2px}
.slider input[type=range]{
  -webkit-appearance:none;appearance:none;flex:1;height:3px;border-radius:2px;
  background:var(--rule-2);padding:0;border:0;cursor:pointer;
}
.slider input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--dye);border:2px solid var(--card);box-shadow:0 0 0 1px var(--dye);
}
.slider input[type=range]::-moz-range-thumb{
  width:12px;height:12px;border-radius:50%;background:var(--dye);border:2px solid var(--card);
}
.slider input[type=range]:focus-visible{outline:2px solid var(--dye);outline-offset:3px}
.slider button{
  font:inherit;font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;
  border:1px solid var(--rule-2);background:var(--card);color:var(--ink-3);
  border-radius:4px;padding:1px 5px;cursor:pointer;
}
.slider button[aria-pressed="true"]{background:var(--dye);border-color:var(--dye);color:#fff}

/* Sensitivity curve */
.curve{margin-top:12px;padding-top:11px;border-top:1px solid var(--rule)}
.curvehead{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.curvetitle{font-size:11.5px;color:var(--ink-2)}
.curveval{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:auto}
.cv-line{fill:none;stroke:var(--dye);stroke-width:2;stroke-linejoin:round}
.cv-grid{stroke:var(--rule);stroke-width:1}
.cv-thr{stroke-width:1;stroke-dasharray:3 3}
.cv-dot{fill:var(--dye);stroke:var(--card);stroke-width:2}
.cv-txt{fill:var(--ink-3);font-family:var(--mono);font-size:9px}

/* Preview modal */
.scrim{
  position:fixed;inset:0;background:rgba(10,14,20,.55);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.modal{
  background:var(--card);border:1px solid var(--rule);border-radius:12px;
  width:min(760px,100%);max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 18px 50px rgba(0,0,0,.28);
}
.mhead{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:14px 18px;border-bottom:1px solid var(--rule);
}
.mhead h3{margin:0;font-size:15.5px;font-weight:620}
.levels{display:flex;border:1px solid var(--rule-2);border-radius:7px;overflow:hidden}
.levels button{
  font:inherit;font-size:11.5px;padding:4px 10px;border:0;cursor:pointer;
  background:var(--card);color:var(--ink-2);border-right:1px solid var(--rule-2);
}
.levels button:last-child{border-right:0}
.levels button[aria-pressed="true"]{background:var(--dye);color:#fff}
.mbody{overflow:auto;padding:0}
.mbody pre{
  margin:0;padding:16px 18px;font-family:var(--mono);font-size:11.5px;line-height:1.65;
  white-space:pre-wrap;word-break:break-word;color:var(--ink-2);
}
.mfoot{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding:12px 18px;border-top:1px solid var(--rule);
}
.mfoot .hint{font-size:11.5px;color:var(--ink-3);margin-right:auto;max-width:44ch;line-height:1.4}

/* Glossary */
.term{
  border-bottom:1px dotted var(--ink-3);cursor:help;
  background:none;border-left:0;border-right:0;border-top:0;padding:0;
  font:inherit;color:inherit;text-align:inherit;
}
.term:hover{border-bottom-color:var(--dye);color:var(--dye)}
.term:focus-visible{outline:2px solid var(--dye);outline-offset:2px;border-radius:2px}
.infobtn{
  border:1px solid var(--rule-2);border-radius:50%;width:13px;height:13px;
  line-height:1;font-size:9px;color:var(--ink-3);cursor:help;
  display:inline-flex;align-items:center;justify-content:center;
  vertical-align:1px;font-family:var(--mono);flex:none;
}
.infobtn:hover{border-color:var(--dye);color:var(--dye);background:var(--dye-soft)}
.tip{
  position:fixed;z-index:70;width:min(310px,calc(100vw - 24px));
  background:var(--card);border:1px solid var(--rule-2);border-radius:9px;
  box-shadow:0 8px 28px rgba(0,0,0,.18);padding:12px 14px;
  font-size:12.5px;line-height:1.5;color:var(--ink-2);
}
.tip h4{
  margin:0 0 5px;font-size:12.5px;font-weight:640;color:var(--ink);
  display:flex;align-items:baseline;gap:7px;
}
.tip h4 .sym{font-family:var(--mono);font-size:11px;color:var(--dye);font-weight:600}
.tip p{margin:0 0 7px}
.tip p:last-child{margin-bottom:0}
.tip .rule{
  font-family:var(--mono);font-size:11px;color:var(--ink-3);
  border-top:1px solid var(--rule);padding-top:7px;margin-top:8px;
}
.tip svg{display:block;width:100%;height:auto;margin:8px 0 2px}
.tip .eq{
  font-family:var(--mono);font-size:11.5px;color:var(--ink);
  background:var(--sunk);border-radius:5px;padding:5px 7px;margin:6px 0;
  overflow-x:auto;white-space:nowrap;
}

/* Findings */
.finding{
  display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.45;
  padding:8px 11px;border-radius:7px;margin-top:7px;
}
.finding b{font-weight:600}
.finding.alert{background:var(--fail-bg);color:var(--fail)}
.finding.watch{background:var(--warn-bg);color:var(--warn)}
.finding.good{background:var(--ok-bg);color:var(--ok)}
.finding .mk{font-family:var(--mono);font-weight:700;flex:none}

/* Project view */
.pbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.pbar select{width:auto;min-width:190px}
.pname{font-size:19px;font-weight:620;letter-spacing:-.01em}
.entry{
  background:var(--card);border:1px solid var(--rule);border-radius:10px;
  padding:13px 15px;margin-bottom:10px;
}
.ehead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ecalc{font-weight:600;font-size:14.5px}
.emeta{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.espacer{flex:1}
.esum{
  display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;
  color:var(--ink-2);margin-bottom:9px;
}
.esum b{color:var(--ink);font-weight:500}
.enote{
  width:100%;font-family:var(--ui);font-size:13px;line-height:1.5;
  border:1px solid var(--rule);border-radius:7px;padding:7px 9px;resize:vertical;
  background:var(--paper);color:var(--ink);min-height:38px;
}
.enote:focus{outline:2px solid var(--dye);outline-offset:-1px;border-color:var(--dye)}
.enote::placeholder{color:var(--ink-3)}
.eacts{display:flex;gap:6px;margin-top:8px}
.btn.sm{font-size:11.5px;padding:4px 9px}
.btn.danger:hover{border-color:var(--fail);color:var(--fail)}
.empty{
  border:1px dashed var(--rule-2);border-radius:10px;padding:26px 20px;
  text-align:center;color:var(--ink-3);font-size:13.5px;line-height:1.6;
}
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);font-size:13px;
  padding:9px 16px;border-radius:8px;z-index:50;
  box-shadow:0 4px 16px rgba(0,0,0,.2);
}
nav .savedcount{
  font-family:var(--mono);font-size:10px;background:var(--sunk);color:var(--ink-3);
  border-radius:9px;padding:1px 6px;
}
nav button[aria-current="true"] .savedcount{background:rgba(255,255,255,.22);color:#fff}
.navsep{height:1px;background:var(--rule);margin:10px 2px}

footer{
  margin-top:34px;padding-top:14px;border-top:1px solid var(--rule);
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  font-size:12px;color:var(--ink-3);
}
.selfcheck{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:5px}

@media (max-width:1160px){
  .cols{grid-template-columns:minmax(0,272px) minmax(0,1fr)}
  .diagram{position:static;grid-column:2}
  #results{grid-column:1/-1}
}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .cols{grid-template-columns:1fr}
  .diagram{grid-column:1}
  nav{
    border-right:0;border-bottom:1px solid var(--rule);position:static;
    padding:12px 0;
  }
  nav ul{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:2px}
  nav button{width:auto;white-space:nowrap;font-size:13px}
  nav .op{display:none}
  .navlabel{display:none}
  main{padding:18px 0 0}
  .cols{grid-template-columns:1fr;gap:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
<header>
  <h1>Napkin</h1>
  <span class="tag">Hand calcs — Shigley &amp; Roark closed-form</span>
  <span class="spacer"></span>
  <div class="toggle" role="group" aria-label="Units">
    <button id="us" aria-pressed="true">US</button>
    <button id="si" aria-pressed="false">Metric</button>
  </div>
</header>

<div class="layout">
  <nav>
    <p class="navlabel">Calculators</p>
    <ul id="nav"></ul>
  </nav>
  <main>
    <div class="calchead">
      <h2 id="ctitle"></h2>
      <p id="cdesc"></p>
    </div>
    <div class="cols">
      <form id="inputs" autocomplete="off"></form>
      <aside class="diagram" id="diagram"></aside>
      <section id="results" aria-live="polite"></section>
    </div>
  </main>
</div>

<footer>
  <span id="check" class="selfcheck"></span>
  <span>US customary internally. Preliminary sizing only — not fatigue, not code work.</span>
</footer>
</div>

<script>
"use strict";

const MAT = {
 "Steel A36 (HR)":        [29e6,36000,58000,.29,.284,27],
 "Steel 1018 (CR)":       [29e6,54000,64000,.29,.284,30],
 "Steel 4140 (Q&T 28HRC)":[29.7e6,95000,110000,.29,.284,24.5],
 "Tool steel P20 (30HRC)":[29.7e6,125000,140000,.29,.284,17],
 "Tool steel H13 (45HRC)":[30e6,185000,215000,.30,.280,14],
 "SS 304 (annealed)":     [28e6,30000,75000,.29,.289,9.4],
 "SS 17-4 PH (H900)":     [28.5e6,170000,190000,.29,.282,10.4],
 "Al 6061-T6":            [10e6,40000,45000,.33,.098,96],
 "Al 7075-T6":            [10.4e6,73000,83000,.33,.102,75],
 "Brass C360 (1/2 hard)": [14e6,45000,58000,.31,.307,67],

const SEC={
 rectangle:(b,h)=>({A:b*h,I:b*h**3/12,S:b*h**2/6,r:h/Math.sqrt(12)}),
 round:d=>({A:Math.PI*d*d/4,I:Math.PI*d**4/64,S:Math.PI*d**3/32,r:d/4}),
 tube:(od,id)=>{const A=Math.PI*(od*od-id*id)/4,I=Math.PI*(od**4-id**4)/64;
   return {A,I,S:I/(od/2),r:Math.sqrt(I/A)};},
 ibeam:(H,B,tf,tw)=>{const A=2*B*tf+(H-2*tf)*tw,I=B*H**3/12-(B-tw)*(H-2*tf)**3/12;
   return {A,I,S:I/(H/2),r:Math.sqrt(I/A)};},
};
function sectionOf(v){
  if(v.shape==="rectangle") return SEC.rectangle(v.b,v.h);
  if(v.shape==="round")     return SEC.round(v.d);
  if(v.shape==="ibeam")     return SEC.ibeam(v.H,v.B,v.tf,v.tw);
  return SEC.tube(v.od,v.id);
}

const RECT_SS=[[1,.2874,.0444],[1.2,.3762,.0616],[1.4,.453,.077],[1.6,.5172,.0906],
 [1.8,.5688,.1017],[2,.6102,.111],[3,.7134,.1335],[4,.741,.14],[1000,.75,.1421]];

 [1.8,.4872,.0267],[2,.4974,.0277],[1000,.5,.0284]];
function stepLookup(tbl,x){let b=tbl[0][1],a=tbl[0][2];
  for(const [r,bb,aa] of tbl){ if(x>=r){b=bb;a=aa;} else break; } return [b,a];}

const VISC=[[50,1.4],[70,.95],[100,.68],[140,.47],[180,.35]];
function viscAt(t){
  if(t<=VISC[0][0])return VISC[0][1];
  if(t>=VISC[VISC.length-1][0])return VISC[VISC.length-1][1];
  for(let i=0;i<VISC.length-1;i++){const[a,va]=VISC[i],[b,vb]=VISC[i+1];
    if(t>=a&&t<=b)return va+(t-a)/(b-a)*(vb-va);}
  return VISC[VISC.length-1][1];
}

const CALCS={
beams:{op:"01",label:"Beams",title:"Beam bending",
 desc:"Six classic load cases. Max stress, deflection against an L/x limit, and the size needed for a target safety factor.",
 fields:[
  {k:"case",l:"Load case",t:"select",d:"ss_point",
   o:Object.entries(BEAM_CASES).map(([k,v])=>[k,v[0]])},
  {k:"L",l:"Span L",u:"in",d:20},
  {k:"P",l:"Point load P",u:"lbf",d:500,show:v=>v.case.includes("point")},
  {k:"w",l:"Distributed w",u:"lbf/in",d:10,show:v=>v.case.includes("uniform")},
  MATFIELD,...SHAPE_FIELDS,
  {k:"limit",l:"Deflection limit L/x",d:240},
  {k:"sf",l:"Target safety factor",d:2},
 ],
 run(v){
  const m=mat(v.material),s=sectionOf(v),C=BEAM_CASES[v.case];
  const M=C[3](v.P,v.w,v.L), stress=M/s.S, defl=C[4](v.P,v.w,v.L,m.E,s.I);
  const sf=stress?m.Sy/stress:null, allow=v.L/v.limit;
  const warn=[];
  if(defl>allow) warn.push(["warn",`Deflection ${fmt(defl)} in exceeds L/${v.limit} = ${fmt(allow)} in — stiffen it`]);
  return {sf,
   rows:[["Max moment M",M,"in-lbf"],["Bending stress",stress,"psi"],
    ["Max deflection",defl,"in"],[`Allowable L/${v.limit}`,allow,"in"],
    ["Section modulus S",s.S,"in³"],["Moment of inertia I",s.I,"in⁴"],
    ["Weight",s.A*v.L*m.rho,"lbf"]],
   solved:[["Required S",M*v.sf/m.Sy,"in³"],
    ["Required h (rect, b as entered)",Math.sqrt(6*M*v.sf/(v.b*m.Sy)),"in"],
    ["Required d (solid round)",Math.cbrt(32*M*v.sf/(Math.PI*m.Sy)),"in"]],
   formula:`M = ${C[1]},  σ = M/S,  δ = ${C[2]},  SF = Sy/σ`, warn};
 }},

plates:{op:"02",label:"Plates",title:"Flat plate under pressure",
 desc:"Circular and rectangular plates, uniform pressure, Roark small-deflection. Rectangular coefficients are tabulated at v = 0.3.",
 fields:[
  {k:"kind",l:"Plate",t:"select",d:"circular",o:[["circular","Circular"],["rect","Rectangular"]]},
  {k:"edge",l:"Edge condition",t:"select",d:"clamped",
   o:[["ss","Simply supported"],["clamped","Clamped"]]},
  {k:"a",l:"Radius a",u:"in",d:3,show:v=>v.kind==="circular"},
  {k:"la",l:"Long side a",u:"in",d:8,show:v=>v.kind==="rect"},
  {k:"sb",l:"Short side b",u:"in",d:4,show:v=>v.kind==="rect"},
  {k:"q",l:"Pressure q",u:"psi",d:200},
  {k:"t",l:"Thickness t",u:"in",d:.75},
  MATFIELD,{k:"sf",l:"Target safety factor",d:2},
 ],
 run(v){
  const m=mat(v.material); let stress,defl,reqt,formula,extra=[];
  if(v.kind==="circular"){
   const D=m.E*v.t**3/(12*(1-m.nu**2));
   if(v.edge==="ss"){
    stress=3*(3+m.nu)*v.q*v.a**2/(8*v.t**2);
    defl=((5+m.nu)/(1+m.nu))*v.q*v.a**4/(64*D);
    reqt=v.a*Math.sqrt(3*(3+m.nu)*v.q*v.sf/(8*m.Sy));
    formula="σ = 3(3+v)qa²/8t² (centre),  δ = ((5+v)/(1+v))qa⁴/64D";
   } else {
    stress=3*v.q*v.a**2/(4*v.t**2); defl=v.q*v.a**4/(64*D);
    reqt=v.a*Math.sqrt(3*v.q*v.sf/(4*m.Sy));
    formula="σ = 3qa²/4t² (edge),  δ = qa⁴/64D";
   }
   extra=[["Plate rigidity D",D,"lbf-in"]];
  } else {
   let a=v.la,b=v.sb; if(b>a){[a,b]=[b,a];}
   const ratio=a/b, [beta,alpha]=stepLookup(v.edge==="ss"?RECT_SS:RECT_CL,ratio);
   stress=beta*v.q*b*b/(v.t*v.t); defl=alpha*v.q*b**4/(m.E*v.t**3);
   reqt=b*Math.sqrt(beta*v.q*v.sf/m.Sy);
   formula="σ = βqb²/t²,  δ = αqb⁴/Et³,  t = b·√(βq·SF/Sy)";
   extra=[["Aspect ratio a/b",ratio,""],["β",beta,""],["α",alpha,""]];
  }
  const sf=stress?m.Sy/stress:null, warn=[];
  if(defl>v.t/2) warn.push(["warn",`Deflection ${fmt(defl)} in exceeds t/2 — small-deflection theory is stretched, consider membrane behaviour or FEA`]);
  return {sf,rows:[...extra,["Max stress",stress,"psi"],["Max deflection",defl,"in"]],
   solved:[["Required thickness t",reqt,"in"]],formula,warn};
 }},

columns:{op:"03",label:"Columns",title:"Column buckling",
 desc:"Euler above the transition slenderness, J.B. Johnson below it. Enter the weak axis — a column buckles about its smaller I.",
 fields:[
  {k:"end",l:"End condition",t:"select",d:"pp",o:[["pp","Pinned-pinned"],["ff","Fixed-free"],
    ["fp","Fixed-pinned"],["fx","Fixed-fixed"]]},
  {k:"aisc",l:"K value",t:"select",d:"theory",o:[["theory","Theoretical"],["aisc","AISC design"]]},
  {k:"L",l:"Unbraced length L",u:"in",d:30},
  {k:"P",l:"Axial load P",u:"lbf",d:2000},
  MATFIELD,...SHAPE_FIELDS.map(f=>f.k==="shape"?{...f,d:"round"}:f.k==="d"?{...f,d:.75}:f),
 ],
 run(v){
  const K_T={pp:1,ff:2,fp:.7,fx:.5}, K_A={pp:1,ff:2.1,fp:.8,fx:.65};
  const K=(v.aisc==="aisc"?K_A:K_T)[v.end];
  const m=mat(v.material),s=sectionOf(v);
  const sl=K*v.L/s.r, Cc=Math.sqrt(2*Math.PI**2*m.E/m.Sy);
  const euler=sl>=Cc;
  const scr=euler?Math.PI**2*m.E/(sl*sl):m.Sy*(1-m.Sy*sl*sl/(4*Math.PI**2*m.E));
  const Pcr=scr*s.A, sf=v.P?Pcr/v.P:null, warn=[];
  if(sf!==null&&sf<3) warn.push(["warn",`Safety factor ${sf.toFixed(2)} — buckling fails suddenly, 3+ is the usual target`]);
  if(v.aisc==="theory"&&(v.end==="fx"||v.end==="fp"))
   warn.push(["warn","Theoretical K assumes ideal end fixity; real joints are softer — try the AISC design value"]);
  return {sf,sfTarget:3,
   rows:[["K",K,""],["Slenderness KL/r",sl,""],["Transition Cc",Cc,""],
    ["Regime",euler?"Euler (long)":"Johnson (intermediate)",""],
    ["Critical stress",scr,"psi"],["Critical load Pcr",Pcr,"lbf"]],
   formula:euler?"σcr = π²E/(KL/r)²,  Pcr = σcr·A":"σcr = Sy(1 − Sy(KL/r)²/4π²E),  Pcr = σcr·A",warn};
 }},

shafts:{op:"04",label:"Shafts",title:"Shaft — bending and torsion",
 desc:"Static combined loading by von Mises, with a twist check. Rotating shafts need a Shigley fatigue check on top of this.",
 fields:[
  {k:"d",l:"Diameter d",u:"in",d:.75},
  {k:"M",l:"Bending moment M",u:"in-lbf",d:200},
  {k:"hp",l:"Power",u:"HP",d:5},
  {k:"rpm",l:"Speed",u:"RPM",d:1750},
  {k:"T",l:"Torque (overrides HP)",u:"in-lbf",d:0},
  {k:"L",l:"Length for twist",u:"in",d:12},
  {...MATFIELD,d:"Steel 4140 (Q&T 28HRC)"},
  {k:"sf",l:"Target safety factor",d:2},
 ],
 run(v){
  const m=mat(v.material);
  const T=v.T>0?v.T:(v.hp&&v.rpm?63025*v.hp/v.rpm:0);
  const J=Math.PI*v.d**4/32;
  const tau=16*T/(Math.PI*v.d**3), sb=32*v.M/(Math.PI*v.d**3);
  const vm=Math.sqrt(sb*sb+3*tau*tau), sf=vm?m.Sy/vm:null;
  const twist=(v.L&&T)?T*v.L/(m.G*J)*180/Math.PI:0;
  const warn=[["warn","Static check only — keyways, steps and press fits concentrate stress; add fatigue for anything rotating"]];
  if(v.L&&twist){const perFt=twist/(v.L/12);
   if(perFt>.08) warn.unshift(["warn",`Twist ${perFt.toFixed(3)} deg/ft exceeds the 0.08 deg/ft rule of thumb for power shafts`]);}
  return {sf,
   rows:[["Torque T",T,"in-lbf"],["Torsional shear",tau,"psi"],["Bending stress",sb,"psi"],
    ["von Mises",vm,"psi"],["Polar inertia J",J,"in⁴"],["Twist over L",twist,"deg"]],
   solved:[["Required diameter d",Math.cbrt(32*v.sf*Math.sqrt(v.M**2+.75*T*T)/(Math.PI*m.Sy)),"in"]],
   formula:"τ = 16T/πd³,  σb = 32M/πd³,  σ' = √(σb² + 3τ²),  θ = TL/GJ",warn};
 }},

bolts:{op:"05",label:"Bolts",title:"Bolted joint",
 desc:"Preload, tightening torque, and how much load the joint takes before the bolt yields or the faces separate.",
 fields:[
  {k:"thread",l:"Thread",t:"select",d:"3/8-16",o:Object.keys(THREADS).map(k=>[k,k])},
  {k:"grade",l:"Grade",t:"select",d:"SAE Gr 5",o:Object.keys(GRADES).map(k=>[k,k])},
  {k:"frac",l:"Preload, fraction of proof",d:.75},
  {k:"K",l:"Nut factor K",t:"select",d:"0.2",
   o:[["0.2","0.20 — dry steel"],["0.15","0.15 — zinc plated"],["0.12","0.12 — lubricated"]]},
  {k:"P",l:"External tensile load P",u:"lbf",d:1000},
  {k:"C",l:"Joint stiffness constant C",d:.25},
  {k:"V",l:"Shear load V",u:"lbf",d:0},
 ],
 run(v){
  const [d,At]=THREADS[v.thread], [proof,Sy]=GRADES[v.grade], K=parseFloat(v.K);
  const Fp=proof*At, Fi=v.frac*Fp, Tq=K*Fi*d, Fb=Fi+v.C*v.P;
  const sf=Fb?Fp/Fb:null;
  const lf=(v.C*v.P)?(Sy*At-Fi)/(v.C*v.P):null;
  const sep=v.P?Fi/((1-v.C)*v.P):null;
  const warn=[["warn","Torque-controlled preload scatters ±25% — verify a critical joint by turn-of-nut or direct measurement"]];
  if(sep!==null&&sep<1) warn.unshift(["fail",`Joint separates at ${sep.toFixed(2)}× the applied load`]);
  const rows=[["Nominal dia d",d,"in"],["Tensile stress area At",At,"in²"],
   ["Proof load Fp",Fp,"lbf"],["Preload Fi",Fi,"lbf"],
   ["Tightening torque",Tq,"in-lbf"],["Tightening torque",Tq/12,"ft-lbf"],
   ["Bolt force Fb",Fb,"lbf"],["Load factor to yield",lf,"× P"],
   ["Separation factor",sep,"× P"]];
  if(v.V) rows.push(["SF in shear",.577*Sy/(v.V/At),""]);
  return {sf,rows,formula:"Fp = proof·At,  Fi = frac·Fp,  T = K·Fi·d,  Fb = Fi + C·P",warn};

cooling:{op:"07",label:"Cooling",title:"Cooling lines and heat",
 desc:"Flow to carry a heat load, whether the circuit is actually turbulent, and what it costs in pressure. Laminar flow moves very little heat no matter how much water you push.",
 fields:[
  {k:"Q",l:"Heat load Q",u:"BTU/hr",d:20000},
  {k:"dT",l:"Coolant rise dT",u:"F",d:4},
  {k:"d",l:"Channel diameter",u:"in",d:.4375},
  {k:"gpm",l:"Flow this circuit",u:"GPM",d:2},
  {k:"temp",l:"Water temperature",u:"F",d:100},
  {k:"len",l:"Circuit length",u:"ft",d:10},
  {k:"rough",l:"Wall roughness e",u:"in",d:.0018},
  {k:"K",l:"Minor-loss K total",d:6},
  {k:"pump",l:"Pump available",u:"psi",d:8},
 ],
 run(v){
  const need=v.dT?v.Q/(500*v.dT):0;
  const nu=viscAt(v.temp);
  const V=.4085*v.gpm/(v.d*v.d), Re=3160*v.gpm/(v.d*nu);
  const f=.25/Math.pow(Math.log10(v.rough/(3.7*v.d)+5.74/Math.pow(Re,.9)),2);
  const hf=f*(12*v.len/v.d)*V*V/(2*32.174), hm=v.K*V*V/(2*32.174);
  const dp=.4331*(hf+hm), margin=v.pump-dp;
  let regime = Re>=10000?"Fully turbulent — ideal":Re>=4000?"Turbulent — OK":
               Re>=2300?"Transitional":"Laminar — poor heat transfer";
  const warn=[];
  if(Re<4000) warn.push(["fail",`Re = ${Math.round(Re).toLocaleString()} — not reliably turbulent, heat transfer will disappoint`]);
  if(V<1) warn.push(["warn",`Velocity ${V.toFixed(2)} ft/s is below the 1–2 ft/s minimum`]);
  if(V>10) warn.push(["warn",`Velocity ${V.toFixed(2)} ft/s risks erosion`]);
  if(margin<0) warn.push(["fail","Short on head — bigger pump, larger channel, or split the circuit"]);
  return {sf:null,
   rows:[["Required total flow",need,"GPM"],["Viscosity",nu,"cSt"],["Velocity",V,"ft/s"],
    ["Reynolds",Re,""],["Regime",regime,""],["Friction factor f",f,""],
    ["Friction head",hf,"ft"],["Minor-loss head",hm,"ft"],
    ["Total pressure drop",dp,"psi"],["Pump margin",margin,"psi"]],
   formula:"GPM = Q/(500·dT),  V = 0.4085·GPM/d²,  Re = 3160·GPM/(d·v),  Δp = 0.4331(hf + hm)",warn};
 }},

const SI={in:[25.4,"mm"],"in²":[645.16,"mm²"],"in³":[16387.1,"mm³"],"in⁴":[416231,"mm⁴"],
 lbf:[4.44822,"N"],"lbf/in":[175.127,"N/m"],psi:[.00689476,"MPa"],"in-lbf":[.112985,"N·m"],
 "ft-lbf":[1.35582,"N·m"],GPM:[3.78541,"L/min"],"BTU/hr":[.293071,"W"],F:[null,"°C"],
 "ft/s":[.3048,"m/s"],ft:[.3048,"m"],HP:[.7457,"kW"]};
let metric=false;
function conv(val,unit){
  if(!metric||val==null||typeof val!=="number") return [val,unit];
  const c=SI[unit]; if(!c) return [val,unit];
  if(unit==="F") return [(val-32)/1.8,"°C"];
  return [val*c[0],c[1]];
}

function fmt(x){
  if(x==null) return "—";
  if(typeof x==="string") return x;
  if(!isFinite(x)) return "—";
  const a=Math.abs(x);
  if(a===0) return "0";
  if(a>=1e6||a<1e-4) return x.toExponential(3);
  if(a>=1000) return x.toLocaleString(undefined,{maximumFractionDigits:0});
  if(a>=100) return x.toFixed(1);
  if(a>=1) return x.toFixed(3).replace(/0+$/,"").replace(/\.$/,"");
  return x.toPrecision(4).replace(/0+$/,"").replace(/\.$/,"");
}
const cls=sf=>sf==null?"none":sf<1?"fail":sf<1.5?"warn":"ok";
const word=sf=>sf==null?"—":sf<1?"FAIL":sf<1.5?"MARGINAL":"OK";

/* ---- Diagrams -------------------------------------------------------------
   Schematic, not to scale, except Sections which draws true proportions.
   Each returns { svg, fields, caption }. `fields` are inputs positioned over
   the drawing in percent coordinates, so a dimension can be typed where you
   are looking at it.                                                        */

const VB='viewBox="0 0 320 190" xmlns="http://www.w3.org/2000/svg"';
const arrowDown=(x,y1,y2)=>
 `<path class="dg-load" d="M${x},${y1} L${x},${y2} M${x-3.5},${y2-5} L${x},${y2} L${x+3.5},${y2-5}"/>`;
const arrowUp=(x,y1,y2)=>
 `<path class="dg-load" d="M${x},${y1} L${x},${y2} M${x-3.5},${y2+5} L${x},${y2} L${x+3.5},${y2+5}"/>`;
const dimLine=(x1,x2,y)=>
 `<path class="dg-dim" d="M${x1},${y-5} L${x1},${y+5} M${x2},${y-5} L${x2},${y+5} M${x1},${y} L${x2},${y}"/>
  <path class="dg-dim" d="M${x1+6},${y-3} L${x1},${y} L${x1+6},${y+3}"/>
  <path class="dg-dim" d="M${x2-6},${y-3} L${x2},${y} L${x2-6},${y+3}"/>`;
const hatch=(x,y1,y2,dir)=>{let p="";for(let y=y1;y<y2;y+=7)
  p+=`<path class="dg-hatch" d="M${x},${y} L${x+dir*7},${y+7}"/>`;
  return `<path class="dg-line" d="M${x},${y1} L${x},${y2}"/>${p}`;};
const pinSup=x=>`<path class="dg-fill" d="M${x},82 L${x-9},98 L${x+9},98 Z"/>
  <path class="dg-hatch" d="M${x-13},98 L${x+13},98"/>`;
const rollSup=x=>`<path class="dg-fill" d="M${x},82 L${x-9},94 L${x+9},94 Z"/>
  <circle class="dg-fill" cx="${x-5}" cy="97" r="3"/><circle class="dg-fill" cx="${x+5}" cy="97" r="3"/>
  <path class="dg-hatch" d="M${x-13},101 L${x+13},101"/>`;

const BEAM_DG={
 ss_point:{sup:x=>pinSup(45)+rollSup(275),defl:"M45,80 C110,110 210,110 275,80"},
 ss_uniform:{sup:x=>pinSup(45)+rollSup(275),defl:"M45,80 C105,112 215,112 275,80"},
 cant_point:{sup:()=>hatch(45,52,112,-1),defl:"M45,80 C120,80 200,96 275,112"},
 cant_uniform:{sup:()=>hatch(45,52,112,-1),defl:"M45,80 C120,80 205,94 275,106"},
 fixed_point:{sup:()=>hatch(45,52,112,-1)+hatch(275,52,112,1),
   defl:"M45,80 C95,80 108,102 160,102 C212,102 225,80 275,80"},
 fixed_uniform:{sup:()=>hatch(45,52,112,-1)+hatch(275,52,112,1),
   defl:"M45,80 C95,80 108,100 160,100 C212,100 225,80 275,80"},
};

const DIAGRAMS={
 beams(v){
  const C=BEAM_DG[v.case], pt=v.case.includes("point"), cant=v.case.startsWith("cant");
  let load="";
  if(pt){ const x=cant?275:160; load=arrowDown(x,40,74); }
  else { load='<path class="dg-load" d="M45,44 L275,44"/>';
    for(let x=45;x<=275;x+=(275-45)/8) load+=arrowDown(x,46,74); }
  const svg=`<svg ${VB}>
   ${C.sup()}
   <path class="dg-defl" d="${C.defl}"/>
   <path class="dg-line" d="M45,80 L275,80"/>
   ${load}
   ${dimLine(45,275,150)}
   <text class="dg-txt" x="160" y="176" text-anchor="middle">${
     cant?"fixed at left, free at right":v.case.startsWith("ss")?"simply supported":"fixed both ends"}</text>
  </svg>`;
  const f=[{k:"L",label:"L",x:50,y:79}];
  f.push(pt?{k:"P",label:"P",x:cant?86:50,y:14}:{k:"w",label:"w",x:50,y:14});
  return {svg,fields:f,caption:"Dashed line is the deflected shape, exaggerated."};
 },

 sections(v){
  // true proportions, scaled to fit
  const cx=160,cy=88,box=104;
  let shape="",dims=[];
  if(v.shape==="rectangle"){
   const k=box/Math.max(v.b,v.h,1e-9), w=v.b*k, h=v.h*k;
   shape=`<rect class="dg-body" x="${cx-w/2}" y="${cy-h/2}" width="${w}" height="${h}"/>`
    +dimLine(cx-w/2,cx+w/2,cy+h/2+22)
    +`<path class="dg-dim" d="M${cx+w/2+22},${cy-h/2} L${cx+w/2+22},${cy+h/2}"/>`;
   dims=[{k:"b",label:"b",x:50,y:(cy+h/2+22)/190*100},{k:"h",label:"h",x:(cx+w/2+22)/320*100,y:46}];
  } else if(v.shape==="round"){
   const r=box/2;
   shape=`<circle class="dg-body" cx="${cx}" cy="${cy}" r="${r}"/>`+dimLine(cx-r,cx+r,cy+r+22);
   dims=[{k:"d",label:"d",x:50,y:(cy+r+22)/190*100}];
  } else if(v.shape==="tube"){
   const R=box/2, ri=R*Math.min(v.id/Math.max(v.od,1e-9),.97);
   shape=`<circle class="dg-body" cx="${cx}" cy="${cy}" r="${R}"/>
     <circle cx="${cx}" cy="${cy}" r="${ri}" fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"/>`
     +dimLine(cx-R,cx+R,cy+R+22);
   dims=[{k:"od",label:"OD",x:50,y:(cy+R+22)/190*100},{k:"id",label:"ID",x:50,y:46}];
  } else {
   const k=box/Math.max(v.H,v.B,1e-9),H=v.H*k,B=v.B*k,tf=v.tf*k,tw=v.tw*k;
   const x0=cx-B/2,y0=cy-H/2;
   shape=`<path class="dg-body" d="M${x0},${y0} h${B} v${tf} h${-(B-tw)/2} v${H-2*tf}
     h${(B-tw)/2} v${tf} h${-B} v${-tf} h${(B-tw)/2} v${-(H-2*tf)} h${-(B-tw)/2} Z"/>`
     +dimLine(x0,x0+B,cy+H/2+22);
   dims=[{k:"B",label:"B",x:50,y:(cy+H/2+22)/190*100},{k:"H",label:"H",x:82,y:46}];
  }
  return {svg:`<svg ${VB}>${shape}</svg>`,fields:dims,
   caption:"Drawn to true proportions. Bending axis is horizontal."};
 },

 columns(v){
  const buck=v.end==="ff"?"M160,150 C160,110 185,95 190,45":
             v.end==="pp"?"M160,150 C190,110 190,85 160,45":
             v.end==="fp"?"M160,150 C160,115 188,95 160,45":
                          "M160,150 C182,120 138,80 160,45";
  const base=v.end==="ff"?hatch(146,150,176,1).replace(/M146,150/,"M146,150"):
    `<path class="dg-hatch" d="M144,150 L176,150"/>`+
    [0,1,2,3].map(i=>`<path class="dg-hatch" d="M${146+i*8},150 L${140+i*8},158"/>`).join("");
  const topSym=(v.end==="fx"||v.end==="fp")
    ? `<path class="dg-line" d="M144,45 L176,45"/>`
    : `<circle class="dg-fill" cx="160" cy="45" r="4"/>`;
  return {svg:`<svg ${VB}>
    <path class="dg-defl" d="${buck}"/>
    <path class="dg-line" d="M160,45 L160,150"/>
    ${topSym}${base}
    ${arrowDown(160,12,40)}
    <path class="dg-dim" d="M112,45 L112,150 M107,45 L117,45 M107,150 L117,150"/>
    <text class="dg-txt" x="160" y="176" text-anchor="middle">buckles about the weak axis</text>
   </svg>`,
   fields:[{k:"P",label:"P",x:50,y:8},{k:"L",label:"L",x:26,y:51}],
   caption:"Dashed line is the buckled mode for these end conditions."};
 },

 shafts(v){
  return {svg:`<svg ${VB}>
    <rect class="dg-body" x="60" y="66" width="200" height="30" rx="2"/>
    <path class="dg-thin" d="M60,81 L260,81" stroke-dasharray="6 3"/>
    <path class="dg-load" d="M72,52 A22,16 0 0 1 108,52"/>
    <path class="dg-load" d="M108,52 l-6,-4 M108,52 l-1,-7"/>
    <path class="dg-load" d="M212,52 A22,16 0 0 1 248,52"/>
    <path class="dg-load" d="M212,52 l6,-4 M212,52 l1,-7"/>
    ${arrowDown(160,30,62)}
    <path class="dg-dim" d="M278,66 L278,96 M273,66 L283,66 M273,96 L283,96"/>
    ${dimLine(60,260,128)}
    <text class="dg-key" x="90" y="44" text-anchor="middle">T</text>
    <text class="dg-key" x="230" y="44" text-anchor="middle">T</text>
    <text class="dg-txt" x="160" y="164" text-anchor="middle">combined torsion + bending</text>
   </svg>`,
   fields:[{k:"M",label:"M",x:50,y:12},{k:"d",label:"d",x:88,y:43},{k:"L",label:"L",x:50,y:67}],
   caption:"Torque at both ends, bending moment at mid-span."};
 },

 bolts(v){
  return {svg:`<svg ${VB}>
    <rect class="dg-body" x="86" y="72" width="148" height="20"/>
    <rect class="dg-body" x="86" y="92" width="148" height="20"/>
    <rect class="dg-fill" x="150" y="56" width="20" height="10"/>
    <rect class="dg-fill" x="154" y="66" width="12" height="52"/>
    <rect class="dg-fill" x="150" y="118" width="20" height="10"/>
    <path class="dg-thin" d="M86,92 L234,92"/>
    ${arrowUp(112,64,34)}${arrowUp(208,64,34)}
    ${arrowDown(112,120,150)}${arrowDown(208,120,150)}
    <text class="dg-key" x="160" y="28" text-anchor="middle">P</text>
    <text class="dg-txt" x="248" y="86" >Fi</text>
    <path class="dg-dim" d="M243,72 L243,112 M238,72 L248,72 M238,112 L248,112"/>
    <text class="dg-txt" x="160" y="176" text-anchor="middle">preload Fi clamps, P pulls the joint apart</text>
   </svg>`,
   fields:[{k:"P",label:"P",x:50,y:9},{k:"C",label:"C",x:22,y:49}],
   caption:"C is the bolt's share of P; the rest unloads the clamped faces."};
 },

 pressure(v){
  let arr="";
  for(const a of [0,45,90,135,180,225,270,315]){
   const r1=14,r2=40,rad=a*Math.PI/180;
   arr+=`<path class="dg-load" d="M${160+r1*Math.cos(rad)},${84+r1*Math.sin(rad)}
     L${160+r2*Math.cos(rad)},${84+r2*Math.sin(rad)}"/>`;
  }
  return {svg:`<svg ${VB}>
    <circle class="dg-body" cx="160" cy="84" r="52"/>
    <circle cx="160" cy="84" r="44" fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"/>
    ${arr}
    <path class="dg-dim" d="M160,32 L160,40 M156,36 L164,36"/>
    ${dimLine(116,204,158)}
    <text class="dg-key" x="160" y="88" text-anchor="middle">P</text>
    <text class="dg-txt" x="222" y="52">t</text>
    <path class="dg-dim" d="M216,60 L204,72"/>
   </svg>`,
   fields:[{k:"P",label:"P",x:50,y:12},{k:"t",label:"t",x:80,y:33},{k:"ID",label:"ID",x:50,y:83}],
   caption:"Section through the wall. Pressure acts outward on the bore."};
 },

 plates(v){
  if(v.kind==="circular"){
   let arr="";
   for(let x=76;x<=244;x+=24) arr+=arrowDown(x,34,60);
   const edge=v.edge==="clamped"
     ? hatch(60,62,92,-1)+hatch(260,62,92,1)
     : pinSup(70).replace(/82/g,"66").replace(/98/g,"82")+rollSup(250).replace(/82/g,"66").replace(/94/g,"78").replace(/97/g,"81").replace(/101/g,"85");
   return {svg:`<svg ${VB}>
     <path class="dg-load" d="M64,34 L256,34"/>${arr}
     <rect class="dg-body" x="60" y="62" width="200" height="14"/>
     <path class="dg-defl" d="M60,76 C110,${v.edge==="clamped"?92:98} 210,${v.edge==="clamped"?92:98} 260,76"/>
     ${edge}
     ${dimLine(160,260,130)}
     <text class="dg-txt" x="160" y="176" text-anchor="middle">${
       v.edge==="clamped"?"clamped edge — max stress at the edge":"simply supported — max stress at centre"}</text>
    </svg>`,
    fields:[{k:"q",label:"q",x:50,y:11},{k:"t",label:"t",x:14,y:36},{k:"a",label:"a",x:66,y:68}],
    caption:"Section through the plate. Dashed line is the deflected shape."};
  }
  return {svg:`<svg ${VB}>
    <rect class="dg-body" x="56" y="42" width="208" height="98"/>
    <path class="dg-thin" d="M56,91 L264,91 M160,42 L160,140" stroke-dasharray="4 3"/>
    ${dimLine(56,264,158)}
    <path class="dg-dim" d="M40,42 L40,140 M35,42 L45,42 M35,140 L45,140"/>
    <text class="dg-key" x="160" y="96" text-anchor="middle">q</text>
   </svg>`,
   fields:[{k:"la",label:"a",x:50,y:83},{k:"sb",label:"b",x:12,y:48},{k:"q",label:"q",x:50,y:26}],
   caption:"Plan view. a is the long side; coefficients key off a/b."};
 },

 cooling(v){
  let flow="";
  for(let x=76;x<=236;x+=40) flow+=`<path class="dg-load" d="M${x},84 L${x+22},84 M${x+16},80 L${x+22},84 L${x+16},88"/>`;
  return {svg:`<svg ${VB}>
    <rect class="dg-body" x="56" y="58" width="208" height="52" rx="3"/>
    <rect x="56" y="66" width="208" height="36" fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"/>
    ${flow}
    <path class="dg-dim" d="M40,66 L40,102 M35,66 L45,66 M35,102 L45,102"/>
    ${dimLine(56,264,132)}
    <text class="dg-txt" x="160" y="176" text-anchor="middle">turbulent flow is what moves the heat</text>
   </svg>`,
   fields:[{k:"d",label:"d",x:12,y:44},{k:"len",label:"L",x:50,y:70},{k:"gpm",label:"GPM",x:50,y:26}],
   caption:"Developed length includes every baffle pass, not the straight-line distance."};
 },
};

function renderDiagram(){
  const v=state[current], D=DIAGRAMS[current];
  const el=$("#diagram");
  if(!D){ el.style.display="none"; return; }
  el.style.display="";
  let d; try{ d=D(v); }catch(e){ el.innerHTML=`<p class="dgcap">Diagram unavailable for these inputs.</p>`; return; }
  const shown=new Set(visible(current).map(f=>f.k));
  const fields=d.fields.filter(f=>shown.has(f.k));
  el.innerHTML=`<p class="grouptitle">Diagram</p>
   <div class="dgwrap">${d.svg}
   ${fields.map(f=>{
     const [dv,du]=conv(v[f.k],(CALCS[current].fields.find(x=>x.k===f.k)||{}).u);
     return `<label class="dgfield" style="left:${f.x}%;top:${f.y}%">
       <span>${f.label}</span>
       <input data-k="${f.k}" data-dg="1" data-unit="${(CALCS[current].fields.find(x=>x.k===f.k)||{}).u||""}"
         type="number" step="any" value="${typeof dv==="number"?+dv.toFixed(6):dv}"
         aria-label="${f.label}"></label>`;
   }).join("")}</div>
   <p class="dgcap">${d.caption}</p>
   ${/defl/.test(d.svg)?'<p class="dglegend"><span><i></i>deflected / buckled shape</span></p>':""}
   ${curveSvg()}`;
}

/* ---- Glossary -------------------------------------------------------------
   Definitions written the way you'd explain it at the machine: what it is,
   what it means for the part, then the rule of thumb. A small diagram where a
   picture carries it better than a sentence.                                 */

const TV='viewBox="0 0 260 88" xmlns="http://www.w3.org/2000/svg"';
const G={
 "Section modulus S":{sym:"S = I/c",
  d:"How much bending a cross-section can take, geometry only. It's the moment of inertia divided by the distance from the neutral axis to the furthest fibre.",
  n:"Bending stress is simply M/S, so doubling S halves the stress for the same load.",
  r:"Depth buys far more than width — S goes with h².",
  svg:`<svg ${TV}><rect class="dg-body" x="88" y="16" width="46" height="56"/>
   <path class="dg-thin" d="M74,44 L148,44" stroke-dasharray="4 3"/>

   <text class="dg-key" x="66" y="33">c</text></svg>`},
 "Moment of inertia I":{sym:"I",
  d:"How the area of a section is distributed about the bending axis. Material far from the neutral axis contributes enormously more than material near it.",
  n:"Deflection is inversely proportional to I — this is the number to chase when something is too bendy.",
  r:"For a rectangle I = bh³/12. Triple the depth, twenty-seven times the stiffness."},
 "Radius of gyration r":{sym:"r = √(I/A)",
  d:"An equivalent distance describing how spread out a section is. It's what turns a length into a slenderness.",
  n:"A tube has a much larger r than a solid rod of the same area — which is exactly why tubes make better columns.",
  svg:`<svg ${TV}><circle class="dg-body" cx="72" cy="44" r="26"/>
   <circle class="dg-body" cx="176" cy="44" r="26"/><circle cx="176" cy="44" r="19" fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"/>

   <text class="dg-txt" x="176" y="82" text-anchor="middle">tube — same area, bigger r</text></svg>`},
 "Safety factor":{sym:"SF = Sy/σ",
  d:"How many times the applied stress could grow before the material yields. Above 1 means it holds as calculated.",
  n:"It is not spare capacity you should plan to use — it absorbs what you didn't model: tolerance, material scatter, a load path you missed, someone standing on it.",
  r:"1.5–3 static and well understood · 3+ for buckling, shock or uncertainty · under 1.5 only if you know the load exactly."},
 "Max deflection":{sym:"δ",

  n:"Low means it squashes, high means it bows out sideways long before the material cares.",

 "Transition Cc":{sym:"Cc = √(2π²E/Sy)",
  d:"The slenderness where buckling stops being a stability problem and starts being a strength problem.",
  n:"Above Cc the column is long and Euler applies. Below it, the column partially yields before it buckles, and Johnson's parabola fits reality better.",

 "Critical load Pcr":{sym:"Pcr",
  d:"The axial load at which the column buckles. Past it, deflection runs away — there is no gradual warning.",

 "von Mises":{sym:"σ' = √(σb² + 3τ²)",
